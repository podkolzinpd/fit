# Include inside the existing HTTPS fit-training.ru server after policy approval.
# OTA storage is independent of frontend/API retention and contains no user data.
location ^~ /mobile-updates/android/ {
    alias /var/lib/fit-mobile-updates/android/;
    autoindex off;
    disable_symlinks on;
    if ($uri !~ "^/mobile-updates/android/(bundles/[a-f0-9]{64}\.zip|alpha/[a-f0-9]{64}/latest\.json)$") { return 404; }
    limit_except GET { deny all; }
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "https://localhost" always;
}
