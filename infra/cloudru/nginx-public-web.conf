server {
    listen 80;
    server_name fit-training.ru www.fit-training.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fit-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fit-training.ru www.fit-training.ru;

    ssl_certificate /etc/letsencrypt/live/fit-training.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fit-training.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Keep browser API traffic on the same origin as the web app. This avoids
    # a second DNS lookup for api.fit-training.ru on clients with stale DNS.
    location ^~ /api/ {
        client_max_body_size 50m;
        proxy_read_timeout 120s;
        proxy_buffering off;
        # Stream uploads to the API without depending on client-body temp files.
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Fit Android OTA begin
# Include inside the existing HTTPS fit-training.ru server after policy approval.
# OTA storage is independent of frontend/API retention and contains no user data.
location ^~ /mobile-updates/android/ {
    alias /var/lib/fit-mobile-updates/android/;
    autoindex off;
    disable_symlinks on;
    if ($uri !~ "^/mobile-updates/android/(bundles/[a-f0-9]{64}\.zip|alpha/[a-f0-9]{64}/latest\.json)$") { return 404; }
    limit_except GET { deny all; }
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "https://localhost" always;
}

    # Fit Android OTA end

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        # The stage Nginx already serves immutable files. Streaming prevents the
        # public proxy from spilling responses larger than its memory buffers to
        # proxy_temp, which must not be a dependency for loading the application.
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
