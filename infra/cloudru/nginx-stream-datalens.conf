# DataLens (Yandex Cloud) → managed PostgreSQL fit-stage-postgres.
# Кластер Cloud.ru не имеет публичного адреса, поэтому ВМ пробрасывает TCP без
# разрыва TLS: шифрование идёт от DataLens до PostgreSQL напрямую.
# Второй слой защиты поверх группы безопасности: только адреса DataLens из
# https://yandex.cloud/ru/docs/datalens/operations/connection/create-postgresql
server {
    listen 55432;
    allow 178.154.242.128/28;
    allow 178.154.242.144/28;
    allow 178.154.242.160/28;
    allow 178.154.242.176/28;
    allow 178.154.242.192/28;
    allow 178.154.242.208/28;
    allow 130.193.60.0/28;
    allow 127.0.0.1;
    deny all;
    proxy_pass 10.70.10.67:5432;
    proxy_connect_timeout 5s;
    proxy_timeout 15m;
}
