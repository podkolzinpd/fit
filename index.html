<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — чтобы работали env(safe-area-inset-*) на iPhone с
         вырезом/Dynamic Island (иначе шапка уходит под статус-бар и ＋ не жмётся). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFAF7" />
    <meta name="application-name" content="Fit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fit" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Fit</title>
    <style id="fit-startup-shell-styles">
      html, body, #root { min-height: 100%; }
      body { margin: 0; background: #fbfaf7; color: #202022; }
      .fit-startup-shell {
        position: fixed;
        z-index: 2147483647;
        inset: 0;
        min-height: 100dvh;
        box-sizing: border-box;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 14px;
        padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
        background: #fbfaf7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
        text-align: center;
      }
      .fit-startup-mark {
        display: grid;
        width: 64px;
        height: 64px;
        place-items: center;
        border-radius: 18px;
        background: #202022;
        color: #fbfaf7;
        font-size: 22px;
        font-weight: 700;
      }
      .fit-startup-shell h1 { margin: 8px 0 0; font-size: 24px; line-height: 1.15; }
      .fit-startup-shell p { max-width: 320px; margin: 0; color: #6e6e73; font-size: 15px; line-height: 1.45; }
      .fit-startup-shell button {
        min-width: 220px;
        min-height: 50px;
        margin-top: 10px;
        padding: 0 20px;
        border: 0;
        border-radius: 14px;
        background: #202022;
        color: #fbfaf7;
        font: inherit;
        font-weight: 600;
      }
    </style>
    <!-- Yandex.Metrika counter -->
    <script type="text/javascript">
      const isFitProduction = window.location.hostname === 'fit-drab.vercel.app'
        || window.location.protocol === 'capacitor:';
      if (isFitProduction) {
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=111074543', 'ym');

        ym(111074543, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <main id="fit-startup-shell" class="fit-startup-shell" aria-live="polite">
      <span class="fit-startup-mark" aria-hidden="true">FIT</span>
      <h1 id="fit-startup-title">Открываем Fit…</h1>
      <p id="fit-startup-message">Загружаем приложение.</p>
      <button id="fit-startup-reload" type="button" hidden>Обновить приложение</button>
    </main>
    <script>
      (function () {
        var finished = false
        var startRequested = false
        var probeTimer = null
        var shell = document.getElementById('fit-startup-shell')
        var root = document.getElementById('root')
        var title = document.getElementById('fit-startup-title')
        var message = document.getElementById('fit-startup-message')
        var reload = document.getElementById('fit-startup-reload')

        function showStartupError() {
          if (finished) return
          if (!title || !message || !reload) return
          title.textContent = 'Не удалось открыть Fit'
          message.textContent = 'Обновите приложение. Ваши данные и тренировки сохранены.'
          reload.hidden = false
        }

        function handleLoadError(event) {
          var target = event && event.target
          if (!target || target === window || target.id === 'fit-app-entry') showStartupError()
        }

        var timeout = window.setTimeout(showStartupError, 12000)
        window.addEventListener('error', handleLoadError, true)
        window.addEventListener('unhandledrejection', showStartupError)
        window.addEventListener('fit:asset-load-error', showStartupError)
        reload.addEventListener('click', function () {
          var url = new URL(window.location.href)
          url.searchParams.set('fit-recover', String(Date.now()))
          window.location.replace(url.toString())
        })

        function appIsVisible() {
          if (!root || root.childElementCount === 0) return false
          var bounds = root.getBoundingClientRect()
          return bounds.width > 0 && bounds.height > 0
        }

        function finishStartupWhenVisible() {
          if (finished || !startRequested) return
          if (!appIsVisible()) {
            probeTimer = window.setTimeout(finishStartupWhenVisible, 100)
            return
          }
          finished = true
          window.clearTimeout(timeout)
          if (probeTimer !== null) window.clearTimeout(probeTimer)
          window.removeEventListener('error', handleLoadError, true)
          window.removeEventListener('unhandledrejection', showStartupError)
          window.removeEventListener('fit:asset-load-error', showStartupError)
          if (shell) shell.remove()
          var styles = document.getElementById('fit-startup-shell-styles')
          if (styles) styles.remove()
          delete window.__fitMarkAppStarted
        }

        window.__fitMarkAppStarted = function () {
          startRequested = true
          window.requestAnimationFrame(finishStartupWhenVisible)
        }
      })()
    </script>
    <script id="fit-app-entry" type="module" src="/src/main.tsx"></script>
  </body>
</html>
