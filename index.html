    const nodes=[['ЦЕЛЬ','Где начать?'],['ПЛАН','Что делать?'],['ТРЕНИРОВКА','Что выполнить?'],['ФАКТ','Что получилось?'],['СЛЕДУЮЩИЙ ШАГ','Что дальше?']];
    function problem(){return `<div class="title-block"><div class="eyebrow">03 · ПРОБЛЕМА</div><h2>Начать трудно.<br>Удержаться ещё труднее</h2><p>Без общего контекста человек теряет следующий понятный шаг — особенно после паузы или пропуска.</p></div><div class="problem-route"><div class="problem-line"></div><div class="break">×</div><div class="break-caption">теряется общий контекст</div>${nodes.map((x,i)=>`<div class="problem-node" style="left:${[3,24,45,66,90][i]}%"><i></i><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="actors"><div><span>ЧЕЛОВЕК</span><strong>Теряет следующий понятный шаг и выпадает из режима.</strong></div><div><span>ЕСЛИ ЕСТЬ ТРЕНЕР</span><strong>Цель, программа, факт и обратная связь всё равно собираются вручную.</strong></div></div><div class="takeaway"><span>ГЛАВНЫЙ РАЗРЫВ</span><strong>Спортивный путь прерывается в точке «что делать дальше?»</strong></div>`}
    const segments=[['market-data','≈52%','Данные и активность','Mi Fitness · Huawei Health<br>Garmin · Strava · шагомеры'],['market-training','≈21%','Тренировки','FitStars · Home Workout<br>Fitness Online · Hevy'],['market-food','≈16%','Питание','FatSecret · YAZIO<br>MyFitnessPal'],['market-coach','≈11%','Клуб и тренер','DDX · клубы<br>Trainerize']];
    function market(){return `<div class="title-block"><div class="eyebrow">04 · ЦИФРОВОЙ РЫНОК</div><h2>Цифровой спортивный рынок уже сложился</h2><p>Основная активность — в данных и трекерах. За заметными сервисами стоит длинный хвост небольших приложений.</p></div><div class="market-strip">${segments.map(x=>`<div class="market-seg ${x[0]}"><strong>${x[1]}</strong><h3>${x[2]}</h3><p>${x[3]}</p></div>`).join('')}</div><div class="market-bottom"><div class="tail"><b>≈90%</b><div><strong>приложений — длинный хвост</strong><p>100+ продуктов в российской выборке; нижние 90% делят 7,4% подписочной выручки глобальной категории.</p></div></div><div class="user-stats"><div class="user-stat"><span>РЕГУЛЯРНО</span><strong>≈5,9 млн</strong><p>8% используют регулярно</p></div><div class="user-stat"><span>ИНОГДА</span><strong>≈8,9 млн</strong><p>12% используют периодически</p></div><div class="user-stat"><span>ГОТОВЫ</span><strong>≈9,6 млн</strong><p>13% хотят попробовать</p></div></div></div><div class="takeaway"><span>ВЫВОД</span><strong>Fit может объединить разрозненные цифровые привычки в одном спортивном контексте.</strong></div>`}
    const builders=[['hero',cover],['path',path],['audience',audience],['problem',problem],['market',market]];
    const deck=document.getElementById('deck');let count=0;
    suites.forEach(s=>builders.forEach(([family,build])=>{count++;const el=document.createElement('section');el.className=`slide ${s.cls}${count===1?' active':''}`;el.dataset.section=s.label;el.dataset.family=family;el.innerHTML=`<div class="suite-label">${s.label}</div><div class="fit-mark">Fit</div>${build(s)}<div class="slide-index">${String(count).padStart(2,'0')} / 5</div><aside class="speaker-notes">${notes[family]}</aside>`;deck.appendChild(el)}));
    const slides=[...document.querySelectorAll('.slide')],counter=document.getElementById('counter');
    function fit(){document.documentElement.style.setProperty('--scale',String(Math.min(innerWidth/1600,innerHeight/900)))}function current(){return Math.max(0,Math.min(slides.length-1,(Number(location.hash.slice(1))||1)-1))}function show(){const i=current();slides.forEach((s,n)=>s.classList.toggle('active',n===i));counter.textContent=`${i+1} / ${slides.length}`}function go(d){location.hash=String(Math.max(1,Math.min(slides.length,current()+1+d)))}
    document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))go(1);if(['ArrowLeft','PageUp'].includes(e.key))go(-1)});addEventListener('resize',fit);addEventListener('hashchange',show);fit();show();
  </script>
</body>
</html>
