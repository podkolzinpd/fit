<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script id="fit-invitation-link-bootstrap">
      (function () {
        try {
          if (window.location.pathname !== '/invite' || !window.location.search) return
          var params = new URLSearchParams(window.location.search.slice(1))
          if (params.has('token') || params.has('source')) {
            var referrerPolicy = document.createElement('meta')
            referrerPolicy.name = 'referrer'
            referrerPolicy.content = 'no-referrer'
            document.head.appendChild(referrerPolicy)
          }

          var keys = Array.from(params.keys())
          var tokens = params.getAll('token')
          var sources = params.getAll('source')
          var token = tokens[0] ? tokens[0].trim() : ''
          var source = sources[0] || 'supabase'
          var hashParams = new URLSearchParams(window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash)
          if (hashParams.has('token') || hashParams.has('source')
            || keys.some(function (key) { return key !== 'token' && key !== 'source' })
            || tokens.length !== 1
            || sources.length > 1
            || !/^[A-F0-9]{12}\.[0-9a-f]{64}$/.test(token)
            || (source !== 'supabase' && source !== 'yandex')) return

          var invitation = JSON.stringify({ token: token, source: source, savedAt: Date.now() })
          window.sessionStorage.setItem('fit.pendingInvitationLink.v1', invitation)
          if (window.sessionStorage.getItem('fit.pendingInvitationLink.v1') === invitation) {
            window.history.replaceState(null, '', window.location.pathname)
          }
        } catch (_) {
          // Keep the query intact so InvitationPage can still show the link and explain blocked storage.
        }
      })()
    </script>

    <style id="fit-startup-shell-styles">
      html, body, #root { min-height: 100%; }
      body { margin: 0; background: #fbfaf7; color: #202022; }
      .fit-startup-shell {
        position: fixed;
        z-index: 2147483647;
        inset: 0;
        min-height: 100dvh;
        box-sizing: border-box;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 14px;
        padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
        background: #fbfaf7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
        text-align: center;
      }
      .fit-startup-mark {
        display: block;
        width: auto;
        height: 64px;
        aspect-ratio: 28 / 15;
        object-fit: contain;
        background: transparent;
      }
      .fit-startup-shell h1 { margin: 8px 0 0; font-size: 24px; line-height: 1.15; }
      .fit-startup-shell p { max-width: 320px; margin: 0; color: #6e6e73; font-size: 15px; line-height: 1.45; }
      .fit-startup-shell button {
        min-width: 220px;
        min-height: 50px;
        margin-top: 10px;
        padding: 0 20px;
        border: 0;
        border-radius: 14px;
        background: #202022;
        color: #fbfaf7;
        font: inherit;
        font-weight: 600;
      }
    </style>
    <!-- Shared by the pre-JS shell and React session restoration. Keep after shell cleanup. -->
    <style id="fit-startup-photo-styles">
      .fit-startup-photo {
        position: relative;
        box-sizing: border-box;
        width: 100%;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #111214;
        color: #f1ede6;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      #fit-startup-shell.fit-startup-photo { position: fixed; gap: 0; }
      .fit-startup-photo-image { display: none; }
      .fit-startup-photo > .fit-startup-photo-image:not([hidden]) {
        display: block;
        position: absolute;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
      .fit-startup-photo > .fit-startup-mark,
      .fit-startup-photo > #fit-startup-message { display: none; }
      .fit-startup-photo > #fit-startup-title { margin: 0; font: inherit; }
      @media (min-aspect-ratio: 1/1) {
        .fit-startup-photo > .fit-startup-photo-image:not([hidden]) { object-fit: contain; }
      }
    </style>
    <script id="fit-startup-controller">
      (function () {
        var finished = false
        var startRequested = false
        var errorPending = false
        var probeTimer = null
        var emergencyShell = null
        var configuredTimeout = Number(window.__fitStartupTimeoutMs)
        var timeoutMs = window.location.hostname === '127.0.0.1'
          && Number.isFinite(configuredTimeout)
          && configuredTimeout >= 0
          ? configuredTimeout
          : 12000

        function findShellElements() {
          return {
            shell: document.getElementById('fit-startup-shell'),
            title: document.getElementById('fit-startup-title'),
            message: document.getElementById('fit-startup-message'),
            reload: document.getElementById('fit-startup-reload'),
          }
        }

        function reloadApplication() {
          var url = new URL(window.location.href)
          url.searchParams.set('fit-recover', String(Date.now()))
          window.location.replace(url.toString())
        }

        function bindReload(button) {
          if (!button || button.dataset.fitReloadBound === 'true') return
          button.dataset.fitReloadBound = 'true'
          button.addEventListener('click', reloadApplication)
        }

        function createEmergencyShell() {
          if (emergencyShell && emergencyShell.isConnected) return emergencyShell
          emergencyShell = document.createElement('main')
          emergencyShell.id = 'fit-startup-emergency'
          emergencyShell.className = 'fit-startup-shell'
          emergencyShell.setAttribute('aria-live', 'assertive')
          emergencyShell.innerHTML = [
            '<img class="fit-startup-mark" src="/fit-logo.svg" alt="" aria-hidden="true">',
            '<h1>Не удалось открыть Fit</h1>',
            '<p>Обновите приложение. Ваши данные и тренировки сохранены.</p>',
            '<button type="button">Обновить приложение</button>',
          ].join('')
          bindReload(emergencyShell.querySelector('button'))
          ;(document.body || document.documentElement).appendChild(emergencyShell)
          return emergencyShell
        }

        function showStartupError() {
          if (finished) return
          errorPending = true
          var elements = findShellElements()
          if (!elements.title || !elements.message || !elements.reload) {
            createEmergencyShell()
            return
          }
          elements.title.textContent = 'Не удалось открыть Fit'
          elements.message.textContent = 'Обновите приложение. Ваши данные и тренировки сохранены.'
          elements.reload.hidden = false
          elements.shell.classList.remove('fit-startup-photo')
          elements.shell.setAttribute('aria-live', 'assertive')
          bindReload(elements.reload)
          if (emergencyShell) emergencyShell.remove()
        }

        function handleLoadError(event) {
          var target = event && event.target
          var tagName = target && target.tagName
          if (tagName === 'IMG' && target.classList.contains('fit-startup-photo-image')) {
            target.hidden = true
            return
          }
          var source = target && (target.src || target.href || '')
          var isAppResource = target && (
            target.id === 'fit-app-entry'
            || (tagName === 'SCRIPT' && target.type === 'module')
            || (tagName === 'SCRIPT' && source.indexOf('/assets/') !== -1)
            || (tagName === 'LINK' && target.rel === 'stylesheet' && source.indexOf('/assets/') !== -1)
          )
          if (!target || target === window || isAppResource) showStartupError()
        }

        function attachStartupShell() {
          var elements = findShellElements()
          // Guard only genuinely unstyled content. A ready form must not
          // briefly lose editability while waiting for the next paint.
          var root = document.getElementById('root')
          if (root && document.querySelector('link[data-fit-app-styles][media="print"]')) {
            root.setAttribute('inert', '')
          }
          bindReload(elements.reload)
          if (errorPending) showStartupError()
        }

        function appIsVisible() {
          // Production styles load without blocking the photographic shell.
          // Never reveal React until those styles are applied.
          if (document.querySelector('link[data-fit-app-styles][media="print"]')) return false
          var root = document.getElementById('root')
          if (!root || root.childElementCount === 0) return false
          var bounds = root.getBoundingClientRect()
          return bounds.width > 0 && bounds.height > 0
        }

        function finishStartupWhenVisible() {
          if (finished || !startRequested) return
          if (!appIsVisible()) {
            probeTimer = window.setTimeout(finishStartupWhenVisible, 100)
            return
          }
          finished = true
          document.getElementById('root').removeAttribute('inert')
          window.clearTimeout(timeout)
          if (probeTimer !== null) window.clearTimeout(probeTimer)
          window.removeEventListener('error', handleLoadError, true)
          document.removeEventListener('load', handleStyleLoad, true)
          window.removeEventListener('unhandledrejection', showStartupError)
          window.removeEventListener('fit:asset-load-error', showStartupError)
          document.removeEventListener('DOMContentLoaded', attachStartupShell)
          var shell = document.getElementById('fit-startup-shell')
          if (shell) shell.remove()
          if (emergencyShell) emergencyShell.remove()
          var styles = document.getElementById('fit-startup-shell-styles')
          if (styles) styles.remove()
          delete window.__fitAttachStartupShell
          delete window.__fitMarkAppStarted
        }

        var timeout = window.setTimeout(showStartupError, timeoutMs)
        function handleStyleLoad(event) {
          var target = event.target
          if (target && target.tagName === 'LINK' && target.hasAttribute('data-fit-app-styles')) {
            target.media = 'all'
            window.requestAnimationFrame(finishStartupWhenVisible)
          }
        }
        document.addEventListener('load', handleStyleLoad, true)
        window.addEventListener('error', handleLoadError, true)
        window.addEventListener('unhandledrejection', showStartupError)
        window.addEventListener('fit:asset-load-error', showStartupError)
        document.addEventListener('DOMContentLoaded', attachStartupShell)
        window.__fitAttachStartupShell = attachStartupShell
        window.__fitMarkAppStarted = function () {
          startRequested = true
          window.requestAnimationFrame(finishStartupWhenVisible)
        }
      })()
    </script>
    <!-- Yandex.Metrika counter -->
    <script type="text/javascript">
      const isFitProduction = window.location.hostname === 'fit-training.ru'
        || window.location.protocol === 'capacitor:';
      if (isFitProduction) {
        function fitMetrikaSafeUrl(rawUrl) {
          if (!rawUrl) return '';
          try {
            var url = new URL(rawUrl, window.location.origin);
            if (url.pathname === '/invite') {
              url.searchParams.delete('token');
              url.searchParams.delete('source');
              var hash = new URLSearchParams(url.hash.startsWith('#') ? url.hash.slice(1) : url.hash);
              if (hash.has('token') || hash.has('source')) url.hash = '';
            }
            return url.toString();
          } catch (_) {
            return window.location.origin + '/';
          }
        }
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=111074543', 'ym');

        // Переходный период: 111074543 хранит историю, 113121193 — новый счётчик
        // fit-training.ru. Список должен совпадать с COUNTER_IDS в yandex-metrika.ts.
        [111074543, 113121193].forEach(function (id) {
          ym(id, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: fitMetrikaSafeUrl(document.referrer), url: fitMetrikaSafeUrl(location.href), accurateTrackBounce:true, trackLinks:true});
        });
      }
    </script>
  </head>

    <main id="fit-startup-shell" class="fit-startup-shell fit-startup-photo" aria-live="polite">

      window.__fitAttachStartupShell?.()
    </script>
