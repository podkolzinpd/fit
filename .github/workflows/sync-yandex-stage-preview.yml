name: Sync Yandex stage preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yandex-stage-preview-sync
  cancel-in-progress: false

env:
  STAGE_PREVIEW_BRANCH: codex/yandex-id-stage-pilot

jobs:
  sync:
    name: Fast-forward stage preview through a merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGE_PREVIEW_BRANCH }}
          fetch-depth: 0
      - name: Merge the verified main branch into the preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin "HEAD:$STAGE_PREVIEW_BRANCH"
