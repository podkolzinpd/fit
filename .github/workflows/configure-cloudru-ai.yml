# User-approved temporary audit branch only; never merge or configure production.
name: FIT temporary real-generator audit
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded model-only call or isolated hosted ISO cycle
        required: true
        default: model
        type: choice
        options: [model, cycle]
      request_base64:
        description: Base64 JSON containing only synthetic model input
        required: false
        type: string
permissions:
  contents: read
jobs:
  model:
    if: inputs.mode != 'cycle' && startsWith(github.ref, 'refs/heads/audit/trainer-real-generator-')
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 3
    concurrency:
      group: cloudru-stage-vm
      cancel-in-progress: false
    steps:
      - name: Invoke existing model without application storage
        env:
          REQUEST_BASE64: ${{ inputs.request_base64 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$(hostname)" = fit-stage-app
          test "${#REQUEST_BASE64}" -le 60000
          printf '%s' "$REQUEST_BASE64" | base64 --decode |
            sudo timeout 100 podman exec --workdir /app -i fit-api-stage node --input-type=module -e '
              import {programModelJson} from "./dist/assistant-orchestrator/program/model.js";
              const chunks=[];let size=0;
              for await(const c of process.stdin){size+=c.length;if(size>45000)throw Error("audit_input_limit");chunks.push(c)}
              const x=JSON.parse(Buffer.concat(chunks).toString("utf8"));
              const allowed=["instruction","data","schema","maxTokens","functionName","operationId"];
              if(Object.keys(x).some(k=>!allowed.includes(k))||typeof x.instruction!=="string"||!x.schema||typeof x.schema!=="object"||!Number.isInteger(x.maxTokens)||x.maxTokens<1||x.maxTokens>6500||typeof x.operationId!=="string"||!x.operationId.startsWith("trainer-audit-")||x.functionName!=="trainer-audit")throw Error("audit_input_rejected");
              const started=Date.now();let metric=null;
              try{const value=await programModelJson({...x,timeoutMs:90000,onUsage:(usage,modelUri,requestId)=>{metric={usage,modelFamily:modelUri.split("/").slice(-2).join("/"),requestId}}});console.log(JSON.stringify({ok:true,value,metric,durationMs:Date.now()-started}))}
              catch(e){console.log(JSON.stringify({ok:false,error:String(e?.message??"model_failed").replace(/[^a-zA-Z0-9_ -]/g,"_").slice(0,120),durationMs:Date.now()-started}));process.exitCode=1}
            ' > "$RUNNER_TEMP/trainer-model-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trainer-model-result-${{ github.run_id }}
          path: ${{ runner.temp }}/trainer-model-result.json
          retention-days: 1
          if-no-files-found: error

  cycle:
    if: inputs.mode == 'cycle' && github.ref == 'refs/heads/audit/trainer-real-generator-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install isolated audit dependencies
        run: |
          npm ci
          npm ci --prefix services/api --ignore-scripts
          npm run build --prefix services/api
          npx playwright install --with-deps chromium
      - name: Prepare test-only role and transport
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "create role fit_api login password 'fit-api-test-only' nosuperuser nobypassrls"
          cp -R .audit/iso "$RUNNER_TEMP/trainer-iso"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/trainer-iso/source"
          cp "$RUNNER_TEMP/trainer-iso/model-adapter.js" services/api/dist/assistant-orchestrator/program/model.js
          git rev-parse HEAD > "$RUNNER_TEMP/trainer-iso/checked-out-sha.txt"
      - name: Real ISO program trainer client trainer cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/trainer-iso/run-program-audit.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trainer-iso-cycle-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/trainer-iso/checked-out-sha.txt
            ${{ runner.temp }}/trainer-iso/owned-database.json
            ${{ runner.temp }}/trainer-iso/cleanup-readback.json
            ${{ runner.temp }}/trainer-iso/lifecycle.jsonl
            ${{ runner.temp }}/trainer-iso/browser-events.jsonl
            ${{ runner.temp }}/trainer-iso/program-result.json
            ${{ runner.temp }}/trainer-iso/history-check-result.json
            ${{ runner.temp }}/trainer-iso/program-playwright.json
            ${{ runner.temp }}/trainer-iso/program-artifacts/
            ${{ runner.temp }}/trainer-iso/model-rpc-events.jsonl
            ${{ runner.temp }}/trainer-iso/model-runs/
            ${{ runner.temp }}/trainer-iso/artifact-delivery.jsonl
            ${{ runner.temp }}/trainer-iso/rpc-errors.jsonl
            ${{ runner.temp }}/trainer-iso/rpc-oversize.json
            ${{ runner.temp }}/trainer-iso/first-turn.json
            ${{ runner.temp }}/trainer-iso/first-response.json
            ${{ runner.temp }}/trainer-iso/generation-response.json
            ${{ runner.temp }}/trainer-iso/playwright-stdout.log
            ${{ runner.temp }}/trainer-iso/playwright-stderr.log
            ${{ runner.temp }}/trainer-iso/api-stderr.log
            ${{ runner.temp }}/trainer-iso/frontend.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trainer-iso-summary-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/trainer-iso/checked-out-sha.txt
            ${{ runner.temp }}/trainer-iso/owned-database.json
            ${{ runner.temp }}/trainer-iso/cleanup-readback.json
            ${{ runner.temp }}/trainer-iso/lifecycle.jsonl
            ${{ runner.temp }}/trainer-iso/browser-events.jsonl
            ${{ runner.temp }}/trainer-iso/program-result.json
            ${{ runner.temp }}/trainer-iso/history-check-result.json
            ${{ runner.temp }}/trainer-iso/program-playwright.json
            ${{ runner.temp }}/trainer-iso/model-rpc-events.jsonl
            ${{ runner.temp }}/trainer-iso/model-runs/
            ${{ runner.temp }}/trainer-iso/artifact-delivery.jsonl
            ${{ runner.temp }}/trainer-iso/rpc-errors.jsonl
            ${{ runner.temp }}/trainer-iso/first-turn.json
            ${{ runner.temp }}/trainer-iso/first-response.json
            ${{ runner.temp }}/trainer-iso/generation-response.json
            ${{ runner.temp }}/trainer-iso/api-stderr.log
            ${{ runner.temp }}/trainer-iso/frontend.log
