# User-approved temporary audit branch only; never merge or configure production.
name: FIT model-only synthetic audit
on:
  workflow_dispatch:
    inputs:
      request_base64:
        description: Base64 JSON containing only synthetic model input
        required: true
        type: string
permissions:
  contents: read
jobs:
  model:
    if: startsWith(github.ref, 'refs/heads/audit/trainer-real-generator-')
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 3
    concurrency:
      group: cloudru-stage-vm
      cancel-in-progress: false
    steps:
      - name: Invoke existing model without application storage
        env:
          REQUEST_BASE64: ${{ inputs.request_base64 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$(hostname)" = fit-stage-app
          test "${#REQUEST_BASE64}" -le 60000
          printf '%s' "$REQUEST_BASE64" | base64 --decode |
            sudo timeout 100 podman exec --workdir /app -i fit-api-stage node --input-type=module -e '
              import {programModelJson} from "./dist/assistant-orchestrator/program/model.js";
              const chunks=[];let size=0;
              for await(const c of process.stdin){size+=c.length;if(size>45000)throw Error("audit_input_limit");chunks.push(c)}
              const x=JSON.parse(Buffer.concat(chunks).toString("utf8"));
              const allowed=["instruction","data","schema","maxTokens","functionName","operationId"];
              if(Object.keys(x).some(k=>!allowed.includes(k))||typeof x.instruction!=="string"||!x.schema||typeof x.schema!=="object"||!Number.isInteger(x.maxTokens)||x.maxTokens<1||x.maxTokens>6500||typeof x.operationId!=="string"||!x.operationId.startsWith("trainer-audit-")||x.functionName!=="trainer-audit")throw Error("audit_input_rejected");
              const started=Date.now();let metric=null;
              try{const value=await programModelJson({...x,timeoutMs:90000,onUsage:(usage,modelUri,requestId)=>{metric={usage,modelFamily:modelUri.split("/").slice(-2).join("/"),requestId}}});console.log(JSON.stringify({ok:true,value,metric,durationMs:Date.now()-started}))}
              catch(e){console.log(JSON.stringify({ok:false,error:String(e?.message??"model_failed").replace(/[^a-zA-Z0-9_ -]/g,"_").slice(0,120),durationMs:Date.now()-started}));process.exitCode=1}
            ' > "$RUNNER_TEMP/trainer-model-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trainer-model-result-${{ github.run_id }}
          path: ${{ runner.temp }}/trainer-model-result.json
          retention-days: 1
          if-no-files-found: error
