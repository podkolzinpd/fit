name: Deploy Cloud.ru stage VM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudru-stage.yml'
      - 'services/api/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudru-stage-vm
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare VM and build API image
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDRU_STAGE_AUTODEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEPLOY_HOST: ${{ vars.CLOUDRU_STAGE_HOST }}
      DEPLOY_USER: ${{ vars.CLOUDRU_STAGE_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.CLOUDRU_STAGE_SSH_PRIVATE_KEY }}
      RUNNER_REGISTRATION_TOKEN: ${{ secrets.CLOUDRU_RUNNER_REGISTRATION_TOKEN }}
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$RUNNER_REGISTRATION_TOKEN"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/cloudru-stage"
          chmod 600 "$HOME/.ssh/cloudru-stage"
          cat > "$HOME/.ssh/config" <<EOF
          Host cloudru-stage
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile $HOME/.ssh/cloudru-stage
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Print runner IPv4 for the temporary firewall rule
        id: runner
        shell: bash
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error --ipv4 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          echo "ipv4=$runner_ip" >> "$GITHUB_OUTPUT"
          echo "RUNNER_IPV4=$runner_ip"
          echo "Temporarily allow TCP/22 from ${runner_ip}/32 in the Cloud.ru security group."

      - name: Wait for the temporary SSH rule
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if ssh -o ConnectTimeout=5 cloudru-stage true 2>/dev/null; then
              echo "SSH is reachable."
              exit 0
            fi
            echo "Waiting for TCP/22 from ${{ steps.runner.outputs.ipv4 }}/32 (attempt ${attempt}/120)..."
            sleep 10
          done
          echo "SSH did not become reachable within 20 minutes." >&2
          exit 1

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/fit-source.tgz" "$GITHUB_SHA"

      - name: Configure DNS and install VM runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          ssh cloudru-stage 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -d -m 755 /etc/systemd/resolved.conf.d
          printf '%s\n' \
            '[Resolve]' \
            'DNS=8.8.8.8 8.8.4.4' \
            'FallbackDNS=1.1.1.1 1.0.0.1' \
            | sudo tee /etc/systemd/resolved.conf.d/fit-cloudru.conf >/dev/null
          sudo ln -sfn /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
          sudo systemctl restart systemd-resolved
          getent ahostsv4 github.com >/dev/null
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl jq nginx podman postgresql-client
          REMOTE

      - name: Install the repository self-hosted runner
        shell: bash
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          ssh cloudru-stage \
            "RUNNER_REGISTRATION_TOKEN='$RUNNER_REGISTRATION_TOKEN' REPOSITORY_URL='$REPOSITORY_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          runner_dir=/opt/actions-runner
          runner_name=fit-cloudru-stage
          sudo install -d -m 755 -o deploy -g deploy "$runner_dir"
          cd "$runner_dir"

          if [ ! -x ./config.sh ]; then
            runner_tag="$(curl --fail --silent --show-error \
              https://api.github.com/repos/actions/runner/releases/latest | jq -r .tag_name)"
            test -n "$runner_tag"
            test "$runner_tag" != null
            runner_version="${runner_tag#v}"
            runner_archive="actions-runner-linux-x64-${runner_version}.tar.gz"
            curl --fail --location --silent --show-error \
              --output "/tmp/${runner_archive}" \
              "https://github.com/actions/runner/releases/download/${runner_tag}/${runner_archive}"
            tar -xzf "/tmp/${runner_archive}"
            rm -f "/tmp/${runner_archive}"
          fi

          if [ ! -f .runner ]; then
            ./config.sh \
              --unattended \
              --replace \
              --url "$REPOSITORY_URL" \
              --token "$RUNNER_REGISTRATION_TOKEN" \
              --name "$runner_name" \
              --labels cloudru-stage \
              --work _work
          fi

          sudo ./svc.sh install deploy || true
          sudo ./svc.sh start
          sudo ./svc.sh status
          REMOTE

      - name: Upload source and build API image
        shell: bash
        run: |
          set -euo pipefail
          scp "$RUNNER_TEMP/fit-source.tgz" cloudru-stage:/tmp/fit-source.tgz
          ssh cloudru-stage "DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          release_dir="/opt/fit/releases/$DEPLOY_SHA"
          sudo install -d -m 755 "$release_dir"
          sudo tar -xzf /tmp/fit-source.tgz -C "$release_dir"
          rm -f /tmp/fit-source.tgz
          sudo podman build --pull=always -t "localhost/fit-api:$DEPLOY_SHA" "$release_dir/services/api"
          sudo ln -sfn "$release_dir" /opt/fit/current
          printf '%s\n' "$DEPLOY_SHA" | sudo tee /opt/fit/DEPLOYED_SHA >/dev/null
          sudo podman image exists "localhost/fit-api:$DEPLOY_SHA"
          REMOTE

      - name: Report prepared revision
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(ssh cloudru-stage 'cat /opt/fit/DEPLOYED_SHA')"
          test "$remote_sha" = "$GITHUB_SHA"
          echo "Prepared Cloud.ru VM revision: $remote_sha"
          echo "The API container is built but intentionally not started until runtime secrets and the migration dry-run are verified."
