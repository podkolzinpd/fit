name: Deploy Vital exercise media

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vital-media
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Decrypt and verify reviewed media
        run: node scripts/prepare-vital-media.mjs
        env:
          VITAL_MEDIA_KEY: ${{ secrets.VITAL_MEDIA_KEY }}
      - name: Upload and verify private media
        run: node scripts/deploy-vital-media.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
