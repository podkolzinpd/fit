name: Verify production domain redirect

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-domain-redirect-monitor
  cancel-in-progress: true

jobs:
  verify:
    name: Verify legacy links and canonical frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify permanent redirects and query preservation
        run: node scripts/verify-production-domain-redirect.mjs --report production-domain-redirect.json
      - name: Publish the sanitized result
        if: always()
        run: |
          if test -f production-domain-redirect.json; then
            jq -r '
              "Production domain redirect: " + .status
              + "; passed=" + ([.results[] | select(.passed)] | length | tostring)
              + "/" + (.results | length | tostring)
            ' production-domain-redirect.json >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-domain-redirect-${{ github.run_id }}
          path: production-domain-redirect.json
          if-no-files-found: error
          retention-days: 7
