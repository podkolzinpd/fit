name: Release Android APK and OTA

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful full CI run for current main
        required: true
        type: string
      make_apk:
        description: Also build a signed APK for the current native contract
        type: boolean
        default: true
      reset:
        description: Publish a signed return to builtin instead of a web bundle
        type: boolean
        default: false
  workflow_run:
    workflows: [Prepare Cloud.ru frontend without public routing]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-ota-release
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.FIT_ANDROID_OTA_AUTODEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Require current trusted main and full successful CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          FRONTEND_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$GITHUB_REF" = refs/heads/main
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          if test -n "$FRONTEND_RUN_ID"; then
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FRONTEND_RUN_ID")
            test "$(jq -r .path <<<"$run")" = .github/workflows/prepare-cloudru-frontend.yml
            test "$(jq -r .head_sha <<<"$run")" = "$commit"
            test "$(jq -r .head_branch <<<"$run")" = main
            test "$(jq -r .conclusion <<<"$run")" = success
            CI_RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=30"               --jq ".workflow_runs[] | select(.head_sha == \"$commit\" and (.event == \"push\" or .event == \"workflow_dispatch\")) | .id" | head -n 1)
          fi
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" | jq -e --arg commit "$commit" --arg repo "$GITHUB_REPOSITORY" '
            .path == ".github/workflows/ci.yml" and .head_sha == $commit and
            .head_repository.full_name == $repo and .head_branch == "main" and
            (.event == "push" or .event == "workflow_dispatch") and
            .status == "completed" and .conclusion == "success"' >/dev/null
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    runs-on: ubuntu-latest
    environment: fit-frontend-candidate
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:ota:test
      - name: Verify real Nginx OTA routing before signing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          node --test scripts/android-ota-nginx.test.mjs
      - name: Build Android web layer with the web release feature configuration
        env:
          FIT_ANDROID_OTA_ENABLED: 'true'
          FIT_SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          FIT_LIME_FONTS_REQUIRED: 'true'
          FIT_LIME_YS_GEO_REGULAR_BASE64_PART1: ${{ secrets.FIT_LIME_YS_GEO_REGULAR_BASE64_PART1 }}
          FIT_LIME_YS_GEO_REGULAR_BASE64_PART2: ${{ secrets.FIT_LIME_YS_GEO_REGULAR_BASE64_PART2 }}
          FIT_LIME_YS_GEO_MEDIUM_BASE64_PART1: ${{ secrets.FIT_LIME_YS_GEO_MEDIUM_BASE64_PART1 }}
          FIT_LIME_YS_GEO_MEDIUM_BASE64_PART2: ${{ secrets.FIT_LIME_YS_GEO_MEDIUM_BASE64_PART2 }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_YANDEX_API_BASE_URL: https://api.fit-training.ru
          VITE_SPEECHKIT_RELAY_URL: ${{ vars.CLOUDRU_SPEECHKIT_RELAY_URL || '' }}
          VITE_YANDEX_OAUTH_CLIENT_ID: fdc7e12c472b475690fbb387d8698663
          VITE_YANDEX_APP_SESSION_ENABLED: 'true'
          VITE_YANDEX_MAIN_ROUTING_ENABLED: 'true'
          VITE_YANDEX_NATIVE_REGISTRATION_ENABLED: 'true'
          VITE_YANDEX_ONLY_AUTH_ENABLED: 'true'
          VITE_ASSISTANT_PROGRAM_ENABLED: ${{ vars.CLOUDRU_AI_ENABLED == 'true' && 'true' || 'false' }}
          VITE_MAINTENANCE_MODE: 'false'
          # Временная плашка «Fit снова работает, ИИ восстанавливаем». Снять: 'false'.
          VITE_SERVICE_NOTICE_ENABLED: 'true'
          VITE_CONTEST_WINNER_ENABLED: ${{ vars.VITE_CONTEST_WINNER_ENABLED || 'true' }}
          VITE_CONTEST_WINNER_PILOT_USER_IDS: ${{ vars.VITE_CONTEST_WINNER_PILOT_USER_IDS || '092bfc1b-db7c-450d-9f60-aaf9ea4df975,50536f5c-e380-419e-8fa7-410a2c6b249c' }}
          VITE_CLIENT_LIME_ENABLED: ${{ vars.VITE_CLIENT_LIME_ENABLED || 'false' }}
          VITE_CLIENT_WORKOUT_REDESIGN_ENABLED: ${{ vars.VITE_CLIENT_WORKOUT_REDESIGN_ENABLED || 'false' }}
          VITE_CLIENT_WORKOUT_ROLLOUT_MODE: ${{ vars.VITE_CLIENT_WORKOUT_ROLLOUT_MODE || 'pilot' }}
          VITE_CLIENT_WORKOUT_REDESIGN_PILOT_USER_IDS: ${{ vars.VITE_CLIENT_WORKOUT_REDESIGN_PILOT_USER_IDS || '' }}
          VITE_TRAINER_FINANCE_ENABLED: ${{ vars.VITE_TRAINER_FINANCE_ENABLED || 'true' }}
          VITE_TRAINER_FINANCE_PILOT_USER_IDS: ${{ vars.VITE_TRAINER_FINANCE_PILOT_USER_IDS || '' }}
          VITE_NUTRITION_ENABLED: ${{ vars.VITE_NUTRITION_ENABLED || 'false' }}
          VITE_NUTRITION_NATIVE_COHORT: ${{ vars.VITE_NUTRITION_NATIVE_COHORT || 'false' }}
          VITE_NUTRITION_PILOT_USER_IDS: ${{ vars.VITE_NUTRITION_PILOT_USER_IDS || '' }}
          VITE_QUICK_WORKOUT_ENTRY_ENABLED: ${{ vars.VITE_QUICK_WORKOUT_ENTRY_ENABLED || 'false' }}
          VITE_QUICK_WORKOUT_ENTRY_ROLLOUT_MODE: ${{ vars.VITE_QUICK_WORKOUT_ENTRY_ROLLOUT_MODE || 'pilot' }}
          VITE_QUICK_WORKOUT_ENTRY_PILOT_USER_IDS: ${{ vars.VITE_QUICK_WORKOUT_ENTRY_PILOT_USER_IDS || '' }}
          VITE_COACH_WORKOUT_ROLLOUT_MODE: ${{ vars.VITE_COACH_WORKOUT_ROLLOUT_MODE || 'pilot' }}
          VITE_COACH_WORKOUT_REDESIGN_ENABLED: ${{ vars.VITE_COACH_WORKOUT_REDESIGN_ENABLED || 'false' }}
          VITE_COACH_WORKOUT_REDESIGN_PILOT_USER_IDS: ${{ vars.VITE_COACH_WORKOUT_REDESIGN_PILOT_USER_IDS || '' }}
          VITE_COACH_PLAN_INPUT_ENABLED: ${{ vars.VITE_COACH_PLAN_INPUT_ENABLED || 'false' }}
          VITE_COACH_PLAN_INPUT_PILOT_USER_IDS: ${{ vars.VITE_COACH_PLAN_INPUT_PILOT_USER_IDS || '' }}
          VITE_COACH_PLAN_LAYOUT_ENABLED: ${{ vars.VITE_COACH_PLAN_LAYOUT_ENABLED || 'false' }}
          VITE_COACH_PLAN_LAYOUT_PILOT_USER_IDS: ${{ vars.VITE_COACH_PLAN_LAYOUT_PILOT_USER_IDS || '' }}
          VITE_COACH_LIVE_DENSITY_ENABLED: ${{ vars.VITE_COACH_LIVE_DENSITY_ENABLED || 'false' }}
          VITE_COACH_LIVE_DENSITY_PILOT_USER_IDS: ${{ vars.VITE_COACH_LIVE_DENSITY_PILOT_USER_IDS || '' }}
          VITE_COACH_LIVE_V79_ENABLED: ${{ vars.VITE_COACH_LIVE_V79_ENABLED || 'false' }}
          VITE_COACH_LIVE_V79_PILOT_USER_IDS: ${{ vars.VITE_COACH_LIVE_V79_PILOT_USER_IDS || '' }}
        run: |
          node scripts/check-production-api-routing.mjs
          npm run ios:env:check
          npm run build
          npx cap sync android
      - name: Build and test native APK
        if: inputs.make_apk == true
        run: |
          node scripts/generate-android-ota-native-fixtures.mjs
          cd android
          ./gradlew testDebugUnitTest assembleRelease
      - name: Sign APK with original Fit certificate
        if: inputs.make_apk == true
        env:
          FIT_ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.FIT_ANDROID_RELEASE_KEYSTORE_BASE64 }}
          FIT_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.FIT_ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="$RUNNER_TEMP/fit-release.p12"
          trap 'rm -f "$keyfile"' EXIT
          test -n "$FIT_ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$FIT_ANDROID_RELEASE_STORE_PASSWORD"
          printf '%s' "$FIT_ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          tools=$(dirname "$signer")
          mkdir signed-apk
          "$tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/fit-aligned.apk"
          "$signer" sign --ks "$keyfile" --ks-key-alias fit-release --ks-pass env:FIT_ANDROID_RELEASE_STORE_PASSWORD --key-pass env:FIT_ANDROID_RELEASE_STORE_PASSWORD --out signed-apk/fit-1.1.2-ota-release.apk "$RUNNER_TEMP/fit-aligned.apk"
          "$signer" verify --verbose --print-certs signed-apk/fit-1.1.2-ota-release.apk > signed-apk/signature.txt
          node scripts/verify-android-apk-signature.mjs signed-apk/signature.txt a933c356832d86e306408963056e3662094c3cd2cd7d779118dad86a79bb6978
          "$tools/zipalign" -c -P 16 4 signed-apk/fit-1.1.2-ota-release.apk
          "$tools/aapt" dump badging signed-apk/fit-1.1.2-ota-release.apk > signed-apk/package-info.txt
          grep -q "package: name='com.coachspace.fit' versionCode='6' versionName='1.1.2'" signed-apk/package-info.txt
          if grep -q '^application-debuggable' signed-apk/package-info.txt; then exit 1; fi
          sha256sum signed-apk/*.apk > signed-apk/SHA256SUMS
          cp dist/android-ota-build.json signed-apk/
      - uses: actions/upload-artifact@v4
        if: inputs.make_apk == true
        with:
          name: fit-android-signed-1.1.2
          path: signed-apk/
          if-no-files-found: error
          retention-days: 30
      - name: Package signed OTA with private key outside artifacts
        env:
          OTA_PRIVATE_KEY: ${{ secrets.FIT_ANDROID_OTA_PRIVATE_KEY }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          RESET: ${{ inputs.reset }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="$RUNNER_TEMP/fit-ota-private.pem"
          trap 'rm -f "$keyfile"' EXIT
          test -n "$OTA_PRIVATE_KEY"
          printf '%s' "$OTA_PRIVATE_KEY" > "$keyfile"
          extra=()
          if test "$RESET" = true; then extra+=(--reset); fi
          FIT_ANDROID_OTA_PRIVATE_KEY_PATH="$keyfile" node scripts/package-android-ota.mjs dist ota-release "$SOURCE_COMMIT" "${extra[@]}"
          node scripts/publish-android-ota.mjs verify ota-release "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: fit-android-ota-${{ needs.source.outputs.commit }}
          path: ota-release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [source, build]
    runs-on: [self-hosted, cloudru-stage]
    concurrency:
      group: cloudru-stage-vm
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Require current main before installing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$GITHUB_REF" = refs/heads/main
          test "$(hostname)" = fit-stage-app
          current=$(curl --fail --silent --show-error --max-time 15 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" | jq -er .sha)
          test "$current" = "$SOURCE_COMMIT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: fit-android-ota-${{ needs.source.outputs.commit }}
          path: ota-release
      - name: Verify signatures, install immutable ZIP, activate Nginx and publish manifest last
        env:
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          NEW_NATIVE_APK: ${{ inputs.make_apk }}
        run: |
          set -euo pipefail
          extra=()
          if test "$NEW_NATIVE_APK" = true; then extra+=(--new-native-apk); fi
          sudo "$(command -v node)" scripts/publish-android-ota.mjs publish ota-release "$SOURCE_COMMIT" "${extra[@]}"
      - name: Verify public HTTPS manifest and signed archive readback
        env:
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: node scripts/publish-android-ota.mjs readback ota-release "$SOURCE_COMMIT"
