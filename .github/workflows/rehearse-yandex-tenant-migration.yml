name: Rehearse Yandex tenant migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only source audit, target rollback dry-run, or idempotent stage apply'
        required: true
        type: choice
        default: audit
        options:
          - audit
          - dry-run
          - apply
      tenant_selection:
        description: 'Configured/automatic isolated root, or the complete application cohort'
        required: true
        type: choice
        default: configured
        options:
          - configured
          - smallest-eligible
          - smallest-eligible-standalone-client
          - most-complete-standalone-client
          - full-cohort
      apply_confirmation:
        description: 'Pinned apply, or APPLY_CURRENT_FULL_COHORT_TO_YANDEX_STAGE for one live snapshot'
        required: false
        type: string
      tenant_fingerprint_confirmation:
        description: 'For automatic/full-cohort apply: fingerprint from its successful dry-run'
        required: false
        type: string
      allow_missing_media:
        description: 'Preserve media references but do not require objects in Yandex yet'
        required: true
        type: boolean
        default: false

concurrency:
  group: yandex-tenant-migration
  cancel-in-progress: false

jobs:
  audit:
    name: Audit source tenant
    if: inputs.mode == 'audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci --prefix services/api
      - name: Resolve the reviewed Supabase session pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: >-
          supabase link
          --project-ref "$SUPABASE_PROJECT_ID"
          --password "$SUPABASE_DB_PASSWORD"
      - name: Audit the selected tenant without writing either database
        env:
          FIT_TENANT_REHEARSAL_MODE: audit
          FIT_TENANT_SELECTION_MODE: ${{ inputs.tenant_selection }}
          FIT_TENANT_SOURCE_SSL_ROOT_CERT: certs/supabase-prod-ca-2021.crt
          FIT_TENANT_TRAINER_ID: ${{ secrets.FIT_TENANT_TRAINER_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -s supabase/.temp/pooler-url
          export FIT_TENANT_SOURCE_POOLER_URL="$(<supabase/.temp/pooler-url)"
          npm --prefix services/api run tenant:rehearse:remote

  stage:
    name: Rehearse target transaction
    if: inputs.mode != 'audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
      YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
      YC_OIDC_AUDIENCE: https://github.com/podkolzinpd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci --prefix services/api
      - name: Reject an unconfirmed apply before remote access
        if: inputs.mode == 'apply'
        env:
          APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
          TENANT_FINGERPRINT_CONFIRMATION: ${{ inputs.tenant_fingerprint_confirmation }}
          TENANT_SELECTION: ${{ inputs.tenant_selection }}
        run: |
          case "$APPLY_CONFIRMATION" in
            APPLY_CURRENT_FULL_COHORT_TO_YANDEX_STAGE)
              test "$TENANT_SELECTION" = full-cohort
              test -z "$TENANT_FINGERPRINT_CONFIRMATION"
              ;;
            APPLY_TENANT_TO_YANDEX_STAGE)
              case "$TENANT_SELECTION" in
                configured)
                  ;;
                smallest-eligible|smallest-eligible-standalone-client|most-complete-standalone-client|full-cohort)
                  [[ "$TENANT_FINGERPRINT_CONFIRMATION" =~ ^[0-9a-f]{16}$ ]]
                  ;;
                *)
                  exit 1
                  ;;
              esac
              ;;
            *)
              exit 1
              ;;
          esac
      - name: Resolve the reviewed Supabase session pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: >-
          supabase link
          --project-ref "$SUPABASE_PROJECT_ID"
          --password "$SUPABASE_DB_PASSWORD"
      - name: Install Yandex Cloud CLI
        run: |
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            --output /tmp/install-yc.sh
          bash /tmp/install-yc.sh -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Exchange GitHub OIDC for the bounded deploy identity
        run: scripts/yandex-github-oidc.sh
      - name: Resolve the private migration runner URL
        run: |
          migration_url=$(yc serverless container get \
            --name fit-stage-migration \
            --folder-id "$YC_FOLDER_ID" \
            --format json | jq -er '.url')
          echo "FIT_TENANT_STAGE_CONTAINER_URL=$migration_url" >> "$GITHUB_ENV"
      - name: Export, encrypt and rehearse the selected tenant
        env:
          FIT_TENANT_REHEARSAL_MODE: ${{ inputs.mode }}
          FIT_TENANT_SELECTION_MODE: ${{ inputs.tenant_selection }}
          FIT_TENANT_EXPECTED_FINGERPRINT: ${{ inputs.tenant_fingerprint_confirmation }}
          FIT_TENANT_ALLOW_MISSING_MEDIA: ${{ inputs.allow_missing_media }}
          FIT_TENANT_REMOTE_APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
          FIT_TENANT_SOURCE_SSL_ROOT_CERT: certs/supabase-prod-ca-2021.crt
          FIT_TENANT_TRAINER_ID: ${{ secrets.FIT_TENANT_TRAINER_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -s supabase/.temp/pooler-url
          export FIT_TENANT_SOURCE_POOLER_URL="$(<supabase/.temp/pooler-url)"
          npm --prefix services/api run tenant:rehearse:remote
