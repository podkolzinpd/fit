name: Import one owner-approved private workout journal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect privately approved packet; apply creates one unclaimed card and its reviewed history
        type: choice
        options: [inspect, apply]
        default: inspect
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudru-stage-vm
  cancel-in-progress: false

jobs:
  journal:
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 6
    steps:
      - name: Verify trusted main and require green exact-main CI before apply
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$GITHUB_REF" = refs/heads/main
          test "$(hostname)" = fit-stage-app
          test "$MODE" = inspect || test "$MODE" = apply
          github_api() {
            curl --fail --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/podkolzinpd/fit/$1"
          }
          commit=$(github_api commits/main | jq -er .sha)
          test "$commit" = "$GITHUB_SHA"
          if test "$MODE" = apply; then
            github_api "actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=20" | \
              jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
                'any(.workflow_runs[]; .head_sha == $sha and .head_branch == "main" and
                  .head_repository.full_name == $repo and .path == ".github/workflows/ci.yml" and
                  .event == "push" and .status == "completed" and .conclusion == "success")' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect or atomically import only the approved new-card journal
        env:
          CLOUDRU_DATABASE_CONFIG_JSON: ${{ secrets.CLOUDRU_STAGE_DATABASE_CONFIG_JSON }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          FIT_WORKOUT_HISTORY_TARGET: ${{ secrets.FIT_WORKOUT_HISTORY_TARGET }}
          FIT_JOURNAL_IMPORT_PART_1: ${{ secrets.FIT_JOURNAL_IMPORT_PART_1 }}
          FIT_JOURNAL_IMPORT_PART_2: ${{ secrets.FIT_JOURNAL_IMPORT_PART_2 }}
          FIT_JOURNAL_IMPORT_SHA256: ${{ secrets.FIT_JOURNAL_IMPORT_SHA256 }}
          FIT_JOURNAL_RECEIPT_PUBLIC_KEY_B64: ${{ secrets.FIT_JOURNAL_RECEIPT_PUBLIC_KEY_B64 }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$GITHUB_REF" = refs/heads/main
          test "$(hostname)" = fit-stage-app
          test "$MODE" = inspect || test "$MODE" = apply
          umask 077
          id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$id" =~ ^[0-9]+-[0-9]+$ ]]
          sudo test ! -L /opt/fit/secrets
          test "$(sudo stat -c '%u:%a' /opt/fit/secrets)" = 0:700
          env_file="/opt/fit/secrets/private-journal-$id.env"
          sudo test ! -e "$env_file"
          sudo test ! -L "$env_file"
          sudo install -m 600 /dev/null "$env_file"
          trap 'sudo rm -f -- "$env_file"' EXIT
          output="$RUNNER_TEMP/fit-journal-receipts-$id"
          test ! -e "$output"
          test ! -L "$output"
          install -d -m 700 "$output"
          jq -e '.MIGRATION_DATABASE_HOST == "10.70.10.67" and .MIGRATION_DATABASE_PORT == "5432" and
            .MIGRATION_DATABASE_NAME == "fit" and .MIGRATION_DATABASE_USER == "fit_owner" and
            .DATABASE_HOST == "10.70.10.67" and .DATABASE_PORT == "5432" and
            .DATABASE_NAME == "fit" and .DATABASE_USER == "fit_api" and
            .MIGRATION_DATABASE_URL == null and .DATABASE_URL == null and
            all(.[]; type == "string" and length > 0 and (test("[\u0000-\u001f\u007f]") | not))' \
            <<<"$CLOUDRU_DATABASE_CONFIG_JSON" >/dev/null
          jq -r 'to_entries[] | select(.key | test("^(MIGRATION_DATABASE|DATABASE)_(HOST|PORT|NAME|USER|PASSWORD)$")) | "\(.key)=\(.value)"' \
            <<<"$CLOUDRU_DATABASE_CONFIG_JSON" | sudo tee "$env_file" >/dev/null
          names=(SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID FIT_WORKOUT_HISTORY_TARGET
            FIT_JOURNAL_IMPORT_PART_1 FIT_JOURNAL_IMPORT_PART_2 FIT_JOURNAL_IMPORT_SHA256 FIT_JOURNAL_RECEIPT_PUBLIC_KEY_B64)
          for name in "${names[@]}"; do
            value=${!name}
            test -n "$value"
            echo "::add-mask::$value"
            test "$value" = "${value//$'\n'/}"
            test "$value" = "${value//$'\r'/}"
            printf '%s=%s\n' "$name" "$value" | sudo tee -a "$env_file" >/dev/null
          done
          printf 'MIGRATION_DATABASE_SSL_MODE=require\nDATABASE_SSL_MODE=require\nGITHUB_REF=refs/heads/main\nGITHUB_REPOSITORY=podkolzinpd/fit\nFIT_JOURNAL_IMPORT_MODE=%s\n' "$MODE" | sudo tee -a "$env_file" >/dev/null
          revision=$(cat /opt/fit/RUNNING_SHA)
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          test "$(sudo podman inspect fit-api-stage --format '{{.Config.Image}}')" = "localhost/fit-api:$revision"
          if test "$MODE" = apply; then
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18080/ready >/dev/null
          fi
          sudo podman run --rm --read-only --user "$(id -u):$(id -g)" --memory=384m --cpus=1 --timeout=180 \
            --cap-drop=ALL --security-opt=no-new-privileges --env-file "$env_file" \
            -v "$PWD/scripts:/journal:ro" -v "$output:/receipts:rw" \
            "localhost/fit-api:$revision" node /journal/cloudru-journal-import.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep only encrypted receipts, including an uncertain commit outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-journal-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fit-journal-receipts-${{ github.run_id }}-${{ github.run_attempt }}/*.encrypted.json
          if-no-files-found: warn
          retention-days: 1
