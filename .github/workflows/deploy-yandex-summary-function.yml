name: Deploy production Yandex summary function

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-yandex-summary-function.yml'
      - 'scripts/verify-yandex-function-release.mjs'
      - 'scripts/verify-yandex-function-release.test.mjs'
      - 'services/api/package.json'
      - 'services/api/package-lock.json'
      - 'services/api/src/legacy-summary/**'
      - 'services/api/src/yandex-summary-function.ts'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-yandex-summary-function
  cancel-in-progress: false

env:
  YC_DEPLOY_SA_ID: ${{ vars.YC_SUMMARY_DEPLOY_SA_ID }}
  YC_FOLDER_ID: ${{ vars.YC_SUMMARY_FOLDER_ID }}
  YC_OIDC_AUDIENCE: https://github.com/podkolzinpd
  SUMMARY_FUNCTION_NAME: fit-summarize-client-training
  SUMMARY_RUNTIME_SA_NAME: fit-summarize-client-training
  SUMMARY_LOCKBOX_NAME: fit-summarize-client-training-supabase

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Build the Node function package
        run: |
          npm ci --prefix services/api
          npm --prefix services/api run typecheck
          npm --prefix services/api run test
          npm --prefix services/api run build
          rm -rf .yandex-summary-package
          mkdir -p .yandex-summary-package
          cp services/api/package.json services/api/package-lock.json .yandex-summary-package/
          cp -R services/api/dist .yandex-summary-package/dist

      - name: Install Yandex Cloud CLI
        run: |
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            --output /tmp/install-yc.sh
          bash /tmp/install-yc.sh -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Exchange GitHub OIDC token for Yandex Cloud IAM token
        run: scripts/yandex-github-oidc.sh

      - name: Resolve the existing immutable Lockbox version
        run: |
          set -euo pipefail
          lockbox=$(yc lockbox secret get \
            --name "$SUMMARY_LOCKBOX_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --format json)
          lockbox_id=$(jq -er '.id' <<<"$lockbox")
          lockbox_version_id=$(jq -er '.current_version.id' <<<"$lockbox")

          for required_key in \
            SUPABASE_URL \
            SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            YANDEX_CLOUD_API_KEY \
            YANDEX_CLOUD_FOLDER_ID \
            YANDEX_CLOUD_MODEL_ID; do
            jq -e --arg required_key "$required_key" \
              '.current_version.payload_entry_keys | index($required_key) != null' \
              <<<"$lockbox" >/dev/null
          done

          echo "SUMMARY_LOCKBOX_ID=$lockbox_id" >> "$GITHUB_ENV"
          echo "SUMMARY_LOCKBOX_VERSION_ID=$lockbox_version_id" >> "$GITHUB_ENV"

      - name: Create runtime identity and grant only required access
        run: |
          set -euo pipefail
          if runtime_sa_id=$(yc iam service-account get --name "$SUMMARY_RUNTIME_SA_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq -er '.id' 2>/dev/null); then
            :
          else
            runtime_sa_id=$(yc iam service-account create --name "$SUMMARY_RUNTIME_SA_NAME" \
              --description 'Runtime identity for production Fit training summaries' \
              --folder-id "$YC_FOLDER_ID" --format json | jq -er '.id')
          fi
          yc resource-manager folder add-access-binding "$YC_FOLDER_ID" \
            --role ai.languageModels.user --service-account-id "$runtime_sa_id"
          yc lockbox secret add-access-binding "$SUMMARY_LOCKBOX_ID" \
            --role lockbox.payloadViewer --service-account-id "$runtime_sa_id"
          echo "SUMMARY_RUNTIME_SA_ID=$runtime_sa_id" >> "$GITHUB_ENV"

      - name: Create or update the public summary function
        run: |
          set -euo pipefail
          if ! yc serverless function get --name "$SUMMARY_FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" >/dev/null 2>&1; then
            yc serverless function create "$SUMMARY_FUNCTION_NAME" \
              --description 'Production Fit training summary, backed by Supabase Auth and data' \
              --folder-id "$YC_FOLDER_ID"
          fi
          previous_version_id=$(yc serverless function version get-by-tag \
            --function-name "$SUMMARY_FUNCTION_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --tag '$latest' \
            --format json 2>/dev/null | jq -r '.id // empty' || true)
          version=$(yc serverless function version create \
            --function-name "$SUMMARY_FUNCTION_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --runtime nodejs22 \
            --entrypoint dist/yandex-summary-function.handler \
            --memory 1GB \
            --execution-timeout 120s \
            --service-account-id "$SUMMARY_RUNTIME_SA_ID" \
            --source-path .yandex-summary-package \
            --secret id="$SUMMARY_LOCKBOX_ID",version-id="$SUMMARY_LOCKBOX_VERSION_ID",key=SUPABASE_URL,environment-variable=SUPABASE_URL \
            --secret id="$SUMMARY_LOCKBOX_ID",version-id="$SUMMARY_LOCKBOX_VERSION_ID",key=SUPABASE_PUBLISHABLE_KEY,environment-variable=SUPABASE_PUBLISHABLE_KEY \
            --secret id="$SUMMARY_LOCKBOX_ID",version-id="$SUMMARY_LOCKBOX_VERSION_ID",key=SUPABASE_SERVICE_ROLE_KEY,environment-variable=SUPABASE_SERVICE_ROLE_KEY \
            --secret id="$SUMMARY_LOCKBOX_ID",version-id="$SUMMARY_LOCKBOX_VERSION_ID",key=YANDEX_CLOUD_API_KEY,environment-variable=YANDEX_CLOUD_API_KEY \
            --secret id="$SUMMARY_LOCKBOX_ID",version-id="$SUMMARY_LOCKBOX_VERSION_ID",key=YANDEX_CLOUD_FOLDER_ID,environment-variable=YANDEX_CLOUD_FOLDER_ID \
            --secret id="$SUMMARY_LOCKBOX_ID",version-id="$SUMMARY_LOCKBOX_VERSION_ID",key=YANDEX_CLOUD_MODEL_ID,environment-variable=YANDEX_CLOUD_MODEL_ID \
            --format json)
          echo "SUMMARY_PREVIOUS_VERSION_ID=$previous_version_id" >> "$GITHUB_ENV"
          echo "SUMMARY_CANDIDATE_VERSION_ID=$(jq -er '.id' <<<"$version")" >> "$GITHUB_ENV"

      - name: Verify the candidate and roll back on smoke failure
        run: |
          set -euo pipefail
          node scripts/verify-yandex-function-release.mjs \
            --function-name "$SUMMARY_FUNCTION_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --expected-version-id "$SUMMARY_CANDIDATE_VERSION_ID" \
            --previous-version-id "$SUMMARY_PREVIOUS_VERSION_ID" \
            | tee -a "$GITHUB_STEP_SUMMARY"
