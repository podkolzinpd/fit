name: Deploy training summary function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/summarize-client-training/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/deploy-summary-function.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-training-summary-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Deploy summarize-client-training
        run: >-
          supabase functions deploy summarize-client-training
          --project-ref "$SUPABASE_PROJECT_ID"
          --no-verify-jwt
          --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
