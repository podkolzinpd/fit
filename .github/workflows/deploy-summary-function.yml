name: Deploy training summary function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/summarize-client-training/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/deploy-summary-function.yml'
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: Read recent sanitized failure logs without deploying
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-training-summary-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Deploy summarize-client-training
        if: inputs.diagnose_only != true
        run: >-
          supabase functions deploy summarize-client-training
          --project-ref "$SUPABASE_PROJECT_ID"
          --no-verify-jwt
          --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Diagnose recent summary failures
        if: github.event_name == 'workflow_dispatch' && inputs.diagnose_only == true
        shell: bash
        run: |
          start_at="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          end_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail-with-body --silent --show-error --get \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/analytics/endpoints/logs" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --data-urlencode "iso_timestamp_start=${start_at}" \
            --data-urlencode "iso_timestamp_end=${end_at}" \
            --data-urlencode "sql=select timestamp,severity_text,event_message from logs where source = 'function_logs' and match(event_message, 'summarize-client-training failed') order by timestamp desc limit 20"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
