            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$missed_payload" \
            "${api_url%/}/v1/workouts")
          missed_workout_id=$(jq -er '.workout.id' <<<"$missed_created")
          missed_cancelled=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data '{"expectedVersion":1}' \
            "${api_url%/}/v1/workouts/$missed_workout_id/cancel")
          test "$(jq -er '.workout.version' <<<"$missed_cancelled")" = 2
          missed_rescheduled=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data '{
              "expectedVersion": 2,
              "workoutDate": "2099-01-01",
              "startTime": "12:30"
            }' \
            "${api_url%/}/v1/workouts/$missed_workout_id/reschedule")
          test "$(jq -er '.workout.version' <<<"$missed_rescheduled")" = 3
          missed_read=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/training-data")
          jq -e --arg workout_id "$missed_workout_id" '
            .workouts | any(
              .id == $workout_id
              and .status == "planned"
              and .workoutDate == "2099-01-01"
              and .startTime == "12:30:00"
              and .endTime == null
            )
          ' <<<"$missed_read" >/dev/null
          curl --fail --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data '{"expectedVersion":3}' \
            "${api_url%/}/v1/workouts/$missed_workout_id" >/dev/null
          stage_smoke_check=assignment-results
          result_payload=$(jq -c '
            .workoutDate = "2000-01-02"
            | .startTime = null
            | .endTime = null
            | .notes = "Синтетическая проверка planned result"
          ' <<<"$create_payload")
          result_created=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$result_payload" \
            "${api_url%/}/v1/workouts")
          result_workout_id=$(jq -er '.workout.id' <<<"$result_created")
          result_created_read=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/training-data")
          result_exercise_id=$(jq -er --arg workout_id "$result_workout_id" '
            .workouts[] | select(.id == $workout_id) | .exercises[0].id
          ' <<<"$result_created_read")
          result_set_id=$(jq -er --arg workout_id "$result_workout_id" '
            .workouts[] | select(.id == $workout_id) | .exercises[0].sets[0].id
          ' <<<"$result_created_read")
          result_completed_payload=$(jq -c \
            --arg exercise_id "$result_exercise_id" \
            --arg set_id "$result_set_id" '
            .expectedVersion = 1
            | .exercises[0].sourceExerciseId = $exercise_id
            | .exercises[0].sets[0].sourceSetId = $set_id
            | .exercises[0].sets[0].weightKg = 45
          ' <<<"$result_payload")
          result_completed=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$result_completed_payload" \
            "${api_url%/}/v1/workouts/$result_workout_id/result")
          test "$(jq -er '.workout.version' <<<"$result_completed")" = 3
          result_read=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/training-data")
          jq -e --arg workout_id "$result_workout_id" '
            .workouts | any(
              .id == $workout_id
              and .status == "done"
              and .version == 3
              and (.exercises[0].sets | any(
                .plan.weightKg == 40 and .fact.weightKg == 45
              ))
            )
          ' <<<"$result_read" >/dev/null
          curl --fail --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data '{"expectedVersion":3}' \
            "${api_url%/}/v1/workouts/$result_workout_id" >/dev/null
          stage_smoke_check=live-workout-lifecycle
          live_payload=$(jq -c '
            .notes = "Синтетическая проверка versioned mutation live"
          ' <<<"$create_payload")
          live_created_file=$(mktemp)
          live_created_status=$(curl --silent --show-error \
            --output "$live_created_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$live_payload" \
            "${api_url%/}/v1/workouts")
          test "$live_created_status" = 201
          live_workout_id=$(jq -er '.workout.id' "$live_created_file")
          test "$(jq -er '.workout.version' "$live_created_file")" = 1
          live_created_read=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/training-data")
          live_set_id=$(jq -er --arg workout_id "$live_workout_id" '
            .workouts[]
            | select(.id == $workout_id)
            | .exercises[0].sets[0].id
          ' <<<"$live_created_read")
          live_exercise_id=$(jq -er --arg workout_id "$live_workout_id" '
            .workouts[]
            | select(.id == $workout_id)
            | .exercises[0].id
          ' <<<"$live_created_read")
          start_operation_id=$(cat /proc/sys/kernel/random/uuid)
          start_payload=$(jq -cn \
            --arg operation_id "$start_operation_id" \
            '{expectedVersion: 1, operationId: $operation_id}')
          started=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$start_payload" \
            "${api_url%/}/v1/workouts/$live_workout_id/start")
          jq -e --arg workout_id "$live_workout_id" '
            .workout.id == $workout_id
            and .workout.version == 2
            and .workout.replayed == false
          ' <<<"$started" >/dev/null
          start_replayed=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$start_payload" \
            "${api_url%/}/v1/workouts/$live_workout_id/start")
          jq -e '
            .workout.version == 2 and .workout.replayed == true
          ' <<<"$start_replayed" >/dev/null
          append_exercise_operation_id=$(cat /proc/sys/kernel/random/uuid)
          append_exercise_payload=$(jq -cn \
            --arg operation_id "$append_exercise_operation_id" \
            '{
              expectedVersion: 2,
              operationId: $operation_id,
              exercise: {
                source: "system",
                ref: "push-up",
                customExerciseId: null,
                name: "Отжимания",
                muscleGroup: "chest",
                inputKind: "reps"
              }
            }')
          appended_exercise=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$append_exercise_payload" \
            "${api_url%/}/v1/workouts/$live_workout_id/exercises")
          appended_exercise_id=$(jq -er '
            select(.exercise.version == 3 and .exercise.replayed == false)
            | .exercise.id
          ' <<<"$appended_exercise")
          appended_exercise_replayed=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$append_exercise_payload" \
            "${api_url%/}/v1/workouts/$live_workout_id/exercises")
          jq -e --arg exercise_id "$appended_exercise_id" '
            .exercise.id == $exercise_id
            and .exercise.version == 3
            and .exercise.replayed == true
          ' <<<"$appended_exercise_replayed" >/dev/null
          append_set_operation_id=$(cat /proc/sys/kernel/random/uuid)
          append_set_payload=$(jq -cn \
            --arg operation_id "$append_set_operation_id" \
            '{expectedVersion: 3, operationId: $operation_id}')
          appended_set=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$append_set_payload" \
            "${api_url%/}/v1/workout-exercises/$live_exercise_id/sets")
          appended_set_id=$(jq -er '
            select(.set.version == 4 and .set.replayed == false)
            | .set.id
          ' <<<"$appended_set")
          remove_set_operation_id=$(cat /proc/sys/kernel/random/uuid)
          remove_set_payload=$(jq -cn \
            --arg operation_id "$remove_set_operation_id" \
            '{expectedVersion: 4, operationId: $operation_id}')
          removed_set=$(curl --fail --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$remove_set_payload" \
            "${api_url%/}/v1/workout-sets/$appended_set_id")
          jq -e --arg set_id "$appended_set_id" '
            .set.id == $set_id
            and .set.version == 5
            and .set.replayed == false
          ' <<<"$removed_set" >/dev/null
          removed_set_replayed=$(curl --fail --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$remove_set_payload" \
            "${api_url%/}/v1/workout-sets/$appended_set_id")
          jq -e '
            .set.version == 5 and .set.replayed == true
          ' <<<"$removed_set_replayed" >/dev/null
          replace_operation_id=$(cat /proc/sys/kernel/random/uuid)
          replace_payload=$(jq -cn \
            --arg operation_id "$replace_operation_id" \
            '{
              expectedVersion: 5,
              operationId: $operation_id,
              exercise: {
                source: "system",
                ref: "deadlift",
                customExerciseId: null,
                name: "Становая тяга",
                muscleGroup: "back",
                inputKind: "strength"
              }
            }')
          replaced=$(curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$replace_payload" \
            "${api_url%/}/v1/workouts/$live_workout_id/exercises/$live_exercise_id")
          jq -e --arg exercise_id "$live_exercise_id" '
            .exercise.id == $exercise_id
            and .exercise.version == 6
            and .exercise.replayed == false
          ' <<<"$replaced" >/dev/null
          comment_operation_id=$(cat /proc/sys/kernel/random/uuid)
          comment_payload=$(jq -cn \
            --arg operation_id "$comment_operation_id" \
            '{
              expectedVersion: 6,
              operationId: $operation_id,
              comment: "Держи спину прямо"
            }')
          commented=$(curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$comment_payload" \
            "${api_url%/}/v1/workout-exercises/$live_exercise_id/comment")
          jq -e '
            .exercise.version == 7 and .exercise.replayed == false
          ' <<<"$commented" >/dev/null
          structure_read=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/training-data")
          appended_block_id=$(jq -er \
            --arg workout_id "$live_workout_id" \
            --arg exercise_id "$appended_exercise_id" '
              .workouts[]
              | select(.id == $workout_id)
              | .exercises[]
              | select(.id == $exercise_id)
              | .blockId
            ' <<<"$structure_read")
          reorder_operation_id=$(cat /proc/sys/kernel/random/uuid)
          reorder_payload=$(jq -cn \
            --arg operation_id "$reorder_operation_id" \
            '{
              expectedVersion: 7,
              operationId: $operation_id,
              direction: -1
            }')
          reordered=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$reorder_payload" \
            "${api_url%/}/v1/workouts/$live_workout_id/blocks/$appended_block_id/reorder")
          jq -e --arg block_id "$appended_block_id" '
            .block.id == $block_id
            and .block.version == 8
            and .block.replayed == false
          ' <<<"$reordered" >/dev/null
          save_operation_id=$(cat /proc/sys/kernel/random/uuid)
          save_payload=$(jq -cn \
            --arg operation_id "$save_operation_id" \
            '{
              expectedVersion: 1,
              operationId: $operation_id,
              draft: {
                weightKg: 42.5,
                reps: 9,
                durationMin: null,
                durationSec: null,
                distanceKm: null,
                rpe: 7.5
              }
            }')
          saved_live_set=$(curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$save_payload" \
            "${api_url%/}/v1/workout-sets/$live_set_id/draft")
          jq -e --arg set_id "$live_set_id" '
            .set.id == $set_id
            and .set.version == 2
            and .set.replayed == false
          ' <<<"$saved_live_set" >/dev/null
          saved_live_set_replayed=$(curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$save_payload" \
            "${api_url%/}/v1/workout-sets/$live_set_id/draft")
          jq -e '
            .set.version == 2 and .set.replayed == true
          ' <<<"$saved_live_set_replayed" >/dev/null
          confirm_operation_id=$(cat /proc/sys/kernel/random/uuid)
          confirm_payload=$(jq -cn \
            --arg operation_id "$confirm_operation_id" \
            '{expectedVersion: 2, operationId: $operation_id}')
          confirmed_live_set=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$confirm_payload" \
            "${api_url%/}/v1/workout-sets/$live_set_id/confirm")
          jq -e '
            .set.version == 3 and .set.replayed == false
          ' <<<"$confirmed_live_set" >/dev/null
          finish_operation_id=$(cat /proc/sys/kernel/random/uuid)
          finish_payload=$(jq -cn \
            --arg operation_id "$finish_operation_id" \
            '{expectedVersion: 8, operationId: $operation_id}')
          finished=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$finish_payload" \
            "${api_url%/}/v1/workouts/$live_workout_id/finish")
          jq -e '
            .workout.version == 9 and .workout.replayed == false
          ' <<<"$finished" >/dev/null
          stale_finish_operation_id=$(cat /proc/sys/kernel/random/uuid)
          stale_finish_payload=$(jq -cn \
            --arg operation_id "$stale_finish_operation_id" \
            '{expectedVersion: 8, operationId: $operation_id}')
          stale_finish_status=$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "Content-Type: application/json" \
            --data "$stale_finish_payload" \
            "${api_url%/}/v1/workouts/$live_workout_id/finish")
          test "$stale_finish_status" = 409
          live_finished_read=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/training-data")
          jq -e \
            --arg workout_id "$live_workout_id" \
            --arg set_id "$live_set_id" \
            --arg original_exercise_id "$live_exercise_id" \
            --arg appended_exercise_id "$appended_exercise_id" '
            .workouts | any(
              .id == $workout_id
              and .status == "done"
              and .version == 9
              and .exercises[0].id == $appended_exercise_id
              and .exercises[1].id == $original_exercise_id
              and .exercises[1].name == "Становая тяга"
              and .exercises[1].trainerComment == "Держи спину прямо"
              and (.exercises[1].sets | any(
                  .id == $set_id
                  and .version == 3
                  and .fact.weightKg == 42.5
                  and .fact.reps == 9
                  and .fact.rpe == 7.5
                  and .confirmedAt != null
                ))
            )
          ' <<<"$live_finished_read" >/dev/null
      - name: Roll back the API revision when readiness fails
        if: steps.smoke.outcome == 'failure' && steps.previous.outputs.revision_id != ''
        working-directory: infra/yandex
        run: |
          node ../../scripts/deploy-yandex-serverless-revision.mjs rollback \
            --container-id '${{ steps.previous.outputs.container_id }}' \
            --revision-id '${{ steps.previous.outputs.revision_id }}'
          terraform apply -refresh-only -auto-approve
      - name: Fail after a completed rollback
        if: steps.smoke.outcome == 'failure'
        run: |
          if test -n '${{ steps.previous.outputs.revision_id }}'; then
            echo 'The candidate API failed readiness and the previous revision was restored.' >&2
          else
            echo 'The first API revision failed readiness; there was no previous image to restore.' >&2
          fi
          exit 1

  publish_deployment:
    name: Publish yandex-stage deployment status
    needs: [plan, deploy]
    if: always() && github.ref == 'refs/heads/main' && inputs.plan_only != true
    runs-on: ubuntu-24.04
    permissions:
      deployments: write
    steps:
      - name: Record deployment result without an environment approval gate
        uses: actions/github-script@v7
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const succeeded = process.env.DEPLOY_RESULT === 'success'
            const description = succeeded
              ? 'Automatic Yandex stage delivery succeeded.'
              : 'Automatic Yandex stage delivery failed.'
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'yandex-stage',
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: false,
              description,
            })
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: succeeded ? 'success' : 'error',
              environment: 'yandex-stage',
              auto_inactive: succeeded,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description,
            })
