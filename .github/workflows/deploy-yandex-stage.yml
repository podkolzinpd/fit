name: Deploy Yandex stage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-yandex-stage.yml'
      - 'infra/yandex/**'
      - 'services/api/**'
      - 'scripts/check-yandex-terraform-plan.mjs'
      - 'scripts/deploy-yandex-serverless-revision.mjs'
      - 'scripts/verify-yandex-stage-access.mjs'
      - 'scripts/yandex-github-oidc.sh'
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Create and validate the Terraform plan without applying it'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: yandex-stage
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_CLI_CONFIG_FILE: ${{ github.workspace }}/infra/yandex/terraform.rc.example
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-provider-cache
  TF_VAR_cloud_id: ${{ vars.YC_CLOUD_ID }}
  TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
  TF_VAR_environment: stage
  TF_VAR_api_execution_timeout: '120s'
  TF_VAR_allow_unauthenticated_api: 'true'
  TF_VAR_deployer_member: serviceAccount:${{ vars.YC_DEPLOY_SA_ID }}
  TF_VAR_migration_invoker_member: serviceAccount:${{ vars.YC_DEPLOY_SA_ID }}
  TF_VAR_yandex_oauth_client_id: ${{ vars.YC_YANDEX_OAUTH_CLIENT_ID }}
  TF_VAR_api_cors_allowed_origins: '["http://localhost:5173","https://fit-git-codex-yandex-id-b494d5-uniteddispatch999-8643s-projects.vercel.app"]'
  TF_VAR_api_invoker_member: serviceAccount:${{ vars.YC_DEPLOY_SA_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_OIDC_AUDIENCE: https://github.com/podkolzinpd
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_TFSTATE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_TFSTATE_SECRET_ACCESS_KEY }}

jobs:
  plan:
    name: Review Terraform plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable API image tag
        run: |
          image_tag=$(git rev-parse 'HEAD:services/api')
          echo "TF_VAR_api_image_tag=$image_tag" >>"$GITHUB_ENV"
          echo "TF_VAR_migration_image_tag=$image_tag" >>"$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false
      - uses: actions/cache@v4
        with:
          path: .terraform-provider-cache
          key: terraform-yandex-${{ runner.os }}-${{ hashFiles('infra/yandex/.terraform.lock.hcl') }}
      - name: Prepare Terraform provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Exchange GitHub OIDC token for a short-lived IAM token
        run: scripts/yandex-github-oidc.sh
      - name: Initialize Terraform remote state
        working-directory: infra/yandex
        run: >-
          terraform init
          -backend-config=backend.hcl.example
          -backend-config=bucket=${{ vars.YC_TFSTATE_BUCKET }}
          -backend-config=key=fit/stage/terraform.tfstate
      - name: Validate Terraform
        working-directory: infra/yandex
        run: |
          terraform fmt -check
          terraform validate
      - name: Create reviewed plan
        working-directory: infra/yandex
        run: |
          terraform plan -out=stage.tfplan
          terraform show -json stage.tfplan > stage.tfplan.json
      - name: Enforce plan policy and publish safe summary
        run: >-
          node scripts/check-yandex-terraform-plan.mjs
          infra/yandex/stage.tfplan.json
          --allow-public-api
          --automatic-stage-update

  deploy:
    name: Migrate and deploy API
    needs: plan
    if: github.ref == 'refs/heads/main' && inputs.plan_only != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable API image tag
        run: |
          image_tag=$(git rev-parse 'HEAD:services/api')
          echo "TF_VAR_api_image_tag=$image_tag" >>"$GITHUB_ENV"
          echo "TF_VAR_migration_image_tag=$image_tag" >>"$GITHUB_ENV"
          echo "API_IMAGE_TAG=$image_tag" >>"$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false
      - uses: actions/cache@v4
        with:
          path: .terraform-provider-cache
          key: terraform-yandex-${{ runner.os }}-${{ hashFiles('infra/yandex/.terraform.lock.hcl') }}
      - name: Prepare Terraform provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Exchange GitHub OIDC token for a short-lived IAM token
        run: scripts/yandex-github-oidc.sh
      - name: Initialize Terraform remote state
        working-directory: infra/yandex
        run: >-
          terraform init
          -backend-config=backend.hcl.example
          -backend-config=bucket=${{ vars.YC_TFSTATE_BUCKET }}
          -backend-config=key=fit/stage/terraform.tfstate
      - name: Apply runtime identity attachment permissions
        working-directory: infra/yandex
        run: >-
          terraform apply -auto-approve
          -target=yandex_container_registry_iam_binding.api_image_puller
          -target=yandex_iam_service_account_iam_member.deployer_self_use
          -target=yandex_iam_service_account_iam_member.api_deployer
          -target=yandex_iam_service_account_iam_member.migration_deployer
          -target=yandex_lockbox_secret_iam_member.api_connection_secret_reader
          -target=yandex_lockbox_secret_iam_member.migration_api_connection_secret_reader
          -target=yandex_lockbox_secret_iam_member.migration_connection_secret_reader
      - name: Verify runtime identity permissions are effective
        working-directory: infra/yandex
        run: >-
          node ../../scripts/verify-yandex-stage-access.mjs
          --deployer-sa-id "$YC_DEPLOY_SA_ID"
          --api-runtime-sa-id "$(terraform output -raw api_service_account_id)"
          --migration-runtime-sa-id "$(terraform output -raw migration_service_account_id)"
      - name: Build and push immutable API image once
        env:
          IMAGE_REPOSITORY: cr.yandex/${{ vars.YC_API_REPOSITORY }}
        run: |
          IMAGE="$IMAGE_REPOSITORY:$API_IMAGE_TAG"
          printf '%s' "$YC_TOKEN" | podman login --username iam --password-stdin cr.yandex
          if skopeo inspect --creds "iam:$YC_TOKEN" "docker://$IMAGE" >/dev/null 2>&1; then
            echo "Image $IMAGE already exists; reusing it."
          else
            podman build --platform linux/amd64 --file services/api/Dockerfile --tag "$IMAGE" services/api
            podman push "$IMAGE"
          fi
      - name: Deploy candidate only to the private migration runner
        working-directory: infra/yandex
        run: |
          terraform plan -out=migration-candidate.tfplan \
            -target=yandex_serverless_container.migration \
            -target=yandex_serverless_container_iam_binding.migration_invocation
          terraform show -json migration-candidate.tfplan > migration-candidate.tfplan.json
          node ../../scripts/deploy-yandex-serverless-revision.mjs deploy \
            --plan migration-candidate.tfplan.json \
            --address 'yandex_serverless_container.migration[0]'
          terraform apply -refresh-only -auto-approve
          terraform apply -auto-approve \
            -target=yandex_serverless_container_iam_binding.migration_invocation
      - name: Apply all pending migrations
        working-directory: infra/yandex
        run: |
          migration_url=$(terraform output -raw migration_container_url)
          status=$(curl --silent --show-error --output migration-response.json --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $YC_TOKEN" "${migration_url%/}/migrate")
          if test "$status" != 200; then
            echo "Migration runner returned HTTP $status; the API was not changed." >&2
            exit 1
          fi
          jq -e '.status == "migrated" and (.migrations | type == "array")' migration-response.json >/dev/null
          jq -r '"Applied migrations: " + ((.migrations | length) | tostring)' migration-response.json
      - name: Prepare idempotent stage workout fixture
        working-directory: infra/yandex
        run: |
          migration_url=$(terraform output -raw migration_container_url)
          status=$(curl --silent --show-error \
            --output stage-workout-fixture-response.json --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $YC_TOKEN" \
            "${migration_url%/}/stage/fixtures/workout-read-model")
          if test "$status" != 200; then
            echo "Stage fixture runner returned HTTP $status; the API was not changed." >&2
            exit 1
          fi
          chmod 600 stage-workout-fixture-response.json
          jq -e '
            .status == "fixture_ready"
            and (.seededTrainerCount | type == "number" and . >= 1)
            and (.session.token | test("^[A-Za-z0-9_-]{43}$"))
            and (.session.expiresAt | type == "string")
            and (.session.clientId | test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"; "i"))
            and (.clientSession.token | test("^[A-Za-z0-9_-]{43}$"))
            and (.clientSession.expiresAt | type == "string")
          ' stage-workout-fixture-response.json >/dev/null
          jq -r '"Prepared synthetic fixtures for " + (.seededTrainerCount | tostring) + " stage trainer(s)."' \
            stage-workout-fixture-response.json
      - name: Verify the API runtime database identity before deployment
        working-directory: infra/yandex
        run: |
          migration_url=$(terraform output -raw migration_container_url)
          fixture_token=$(jq -er '.session.token' stage-workout-fixture-response.json)
          fixture_client_id=$(jq -er '.session.clientId' stage-workout-fixture-response.json)
          status=$(curl --silent --show-error \
            --output runtime-database-readiness-response.json --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            --header "X-Fit-Stage-Client-Id: $fixture_client_id" \
            "${migration_url%/}/stage/runtime-database/readiness")
          if test "$status" != 200; then
            if jq -e '
              .status == "runtime_database_not_ready"
              and (.check | IN("clients", "connections", "training-data", "progress"))
              and (.category | IN("authentication", "permission", "network", "tls", "unknown"))
              and (.code == "unknown" or (.code | test("^[A-Z0-9_]{2,64}$")))
            ' runtime-database-readiness-response.json >/dev/null 2>&1; then
              jq -r '"Runtime database preflight failed: check=" + .check + ", category=" + .category + ", code=" + .code' \
                runtime-database-readiness-response.json >&2
            else
              echo "Runtime database preflight returned HTTP $status without safe diagnostics." >&2
            fi
            echo 'The API revision was not changed.' >&2
            exit 1
          fi
          jq -e '
            .status == "runtime_database_ready"
            and (.progressResponseBytes | type == "number" and . > 0)
          ' \
            runtime-database-readiness-response.json >/dev/null
          jq -r '"Runtime database preflight passed for the exact fixture client; serialized progress bytes=" + (.progressResponseBytes | tostring)' \
            runtime-database-readiness-response.json
      - name: Re-plan after migration and enforce policy
        working-directory: infra/yandex
        run: |
          terraform plan -out=stage-final.tfplan
          terraform show -json stage-final.tfplan > stage-final.tfplan.json
          node ../../scripts/check-yandex-terraform-plan.mjs stage-final.tfplan.json \
            --allow-public-api \
            --automatic-stage-update
      - name: Record the current API revision for automatic rollback
        id: previous
        working-directory: infra/yandex
        run: |
          container=$(terraform show -json | jq -c '
            [.values.root_module.resources[]?
              | select(.address == "yandex_serverless_container.api")
              | .values][0] // {}
          ')
          echo "container_id=$(jq -r '.id // ""' <<<"$container")" >>"$GITHUB_OUTPUT"
          echo "revision_id=$(jq -r '.revision_id // ""' <<<"$container")" >>"$GITHUB_OUTPUT"
      - name: Deploy the API revision
        working-directory: infra/yandex
        run: |
          node ../../scripts/deploy-yandex-serverless-revision.mjs deploy \
            --plan stage-final.tfplan.json \
            --address yandex_serverless_container.api
          terraform apply -refresh-only -auto-approve
          terraform plan -out=stage-post-revision.tfplan
          terraform show -json stage-post-revision.tfplan > stage-post-revision.tfplan.json
          node ../../scripts/check-yandex-terraform-plan.mjs stage-post-revision.tfplan.json \
            --allow-public-api \
            --automatic-stage-update
          if jq -e '
            [.resource_changes[]?
              | select(
                  (.address == "yandex_serverless_container.api"
                    or .address == "yandex_serverless_container.migration[0]")
                  and .change.actions != ["no-op"]
                )]
            | length > 0
          ' stage-post-revision.tfplan.json >/dev/null; then
            echo 'A Serverless Container still differs after the direct revision deploy.' >&2
            exit 1
          fi
          terraform apply -auto-approve stage-post-revision.tfplan
      - name: Verify API health and readiness
        id: smoke
        continue-on-error: true
        working-directory: infra/yandex
        run: |
          api_url=$(terraform output -raw api_container_url)
          bootstrap_deadline=$(( $(date +%s) + 90 ))
          candidate_streak=0
          health_status=000
          readiness_status=not_checked
          while true; do
            : > api-health-response.json
            : > api-health-headers.txt
            if health_status=$(curl --silent --show-error --max-time 12 \
              --dump-header api-health-headers.txt \
              --output api-health-response.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $YC_TOKEN" "${api_url%/}/health"); then
              if test "$health_status" = 200 \
                && jq -e --arg release_id "$API_IMAGE_TAG" \
                  '.status == "ok" and .releaseId == $release_id' \
                  api-health-response.json >/dev/null 2>&1; then
                : > api-readiness-response.json
                readiness_status=000
                if readiness_status=$(curl --silent --show-error --max-time 12 \
                  --output api-readiness-response.json --write-out '%{http_code}' \
                  --header "Authorization: Bearer $YC_TOKEN" "${api_url%/}/ready"); then
                  if test "$readiness_status" = 200 \
                    && jq -e '.status == "ready"' api-readiness-response.json >/dev/null 2>&1; then
                    candidate_streak=$(( candidate_streak + 1 ))
                    if test "$candidate_streak" -ge 5; then
                      break
                    fi
                  else
                    candidate_streak=0
                  fi
                else
                  candidate_streak=0
                fi
              else
                candidate_streak=0
              fi
            else
              candidate_streak=0
            fi
            now=$(date +%s)
            if test "$now" -ge "$bootstrap_deadline"; then
              observed_release=$(jq -r '.releaseId // "missing"' api-health-response.json 2>/dev/null || echo invalid)
              echo "API bootstrap did not reach release $API_IMAGE_TAG within 90 seconds; observed release: $observed_release; health HTTP status: $health_status; readiness HTTP status: $readiness_status." >&2
              exit 1
            fi
            remaining=$(( bootstrap_deadline - now ))
            if test "$remaining" -lt 2; then
              sleep "$remaining"
            else
              sleep 2
            fi
          done
          fixture_token=$(jq -er '.session.token' stage-workout-fixture-response.json)
          client_fixture_token=$(jq -er '.clientSession.token' stage-workout-fixture-response.json)
          clients_curl_exit=0
          clients_status=$(curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            --output clients-response.json --dump-header clients-response-headers.txt \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/clients") || clients_curl_exit=$?
          if test "$clients_status" != 200; then
            error_category=$(awk 'toupper($1) ~ /^HTTP\// {value=""} tolower($1) == "x-fit-error-category:" {gsub("\\r", "", $2); value=$2} END {print value}' clients-response-headers.txt)
            error_code=$(awk 'toupper($1) ~ /^HTTP\// {value=""} tolower($1) == "x-fit-error-code:" {gsub("\\r", "", $2); value=$2} END {print value}' clients-response-headers.txt)
            echo "First clients smoke failed: HTTP ${clients_status:-000}; curl_exit=$clients_curl_exit; category=${error_category:-proxy_or_unknown}; code=${error_code:-unknown}." >&2
            exit 1
          fi
          clients=$(cat clients-response.json)
          jq -e '
            .accessMode == "read_only"
            and (.clients | any(
              .fullName == "Тестовый клиент Yandex stage"
              and .canonicalFullName == "Тестовый клиент Yandex stage"
              and .currentWeightKg == 64.5
              and .activity.doneCount >= 1
              and .activity.completionPercent != null
              and .activity.lastWorkoutDate == "2026-08-22"
              and .activity.daysInWork >= 0
              and (.activity.needsAttention | type) == "boolean"
            ))
          ' <<<"$clients" >/dev/null
          connections_curl_exit=0
          connections_status=$(curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            --output connections-response.json --dump-header connections-response-headers.txt \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/connections") || connections_curl_exit=$?
          if test "$connections_status" != 200; then
            error_category=$(awk 'toupper($1) ~ /^HTTP\// {value=""} tolower($1) == "x-fit-error-category:" {gsub("\\r", "", $2); value=$2} END {print value}' connections-response-headers.txt)
            error_code=$(awk 'toupper($1) ~ /^HTTP\// {value=""} tolower($1) == "x-fit-error-code:" {gsub("\\r", "", $2); value=$2} END {print value}' connections-response-headers.txt)
            echo "Connections smoke failed: HTTP ${connections_status:-000}; curl_exit=$connections_curl_exit; category=${error_category:-proxy_or_unknown}; code=${error_code:-unknown}." >&2
            exit 1
          fi
          connections=$(cat connections-response.json)
          jq -e '
            .accessMode == "read_only"
            and (.memberships | any(.isRoot == true))
            and (.invitations | type == "array")
          ' <<<"$connections" >/dev/null
          stage_smoke_headers=stage-smoke-last-headers.txt
          stage_smoke_check=training-data
          : > "$stage_smoke_headers"
          curl() {
            : > "$stage_smoke_headers"
            command curl --dump-header "$stage_smoke_headers" "$@"
          }
          report_stage_smoke_failure() {
            command_exit=$?
            error_category=$(awk 'toupper($1) ~ /^HTTP\// {value=""} tolower($1) == "x-fit-error-category:" {gsub("\\r", "", $2); value=$2} END {print value}' "$stage_smoke_headers")
            error_code=$(awk 'toupper($1) ~ /^HTTP\// {value=""} tolower($1) == "x-fit-error-code:" {gsub("\\r", "", $2); value=$2} END {print value}' "$stage_smoke_headers")
            observed_release=$(awk 'toupper($1) ~ /^HTTP\// {value=""} tolower($1) == "x-fit-release-id:" {gsub("\\r", "", $2); value=$2} END {print value}' "$stage_smoke_headers")
            echo "Stage smoke failed: check=${stage_smoke_check:-unknown}; command_exit=$command_exit; category=${error_category:-proxy_or_unknown}; code=${error_code:-unknown}; release=${observed_release:-proxy_or_unknown}; expected_release=$API_IMAGE_TAG." >&2
          }
          trap report_stage_smoke_failure ERR
          training=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/training-data")
          jq -e '
            .accessMode == "read_only"
            and (.customExercises | any(
              .name == "Тестовая тяга Yandex stage"
              and .inputKind == "strength"
            ))
            and (.workouts | any(
              .notes == "Синтетическая проверка переноса Yandex stage"
              and .workoutDate == "2026-08-22"
              and .status == "done"
              and .sessionRpe == null
              and .wellbeing == null
              and .discomfort == null
              and .clientComment == null
              and .trainerReaction == null
              and .trainerReview == null
              and .clientQuestion == null
              and (.exercises | any(
                .source == "custom"
                and (.sets | any(
                  .fact.weightKg == 42.5 and .fact.reps == 10
                ))
              ))
              and (.exercises | any(
                .ref == "running"
                and (.sets | any(
                  .fact.durationSec == 1740 and .fact.distanceKm == 5.2
                ))
              ))
            ))
            and (.attention | length == 0)
            and (.attentionPreferences | type == "array")
          ' <<<"$training" >/dev/null
          client_id=$(jq -er '
            .clients[]
            | select(.fullName == "Тестовый клиент Yandex stage")
            | .id
          ' <<<"$clients")
          stage_smoke_check=progress-bundle
          progress=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/clients/$client_id/progress")
          jq -e '
            (.entries | any(
              .recordedOn == "2026-08-22"
              and .weightKg == 64.5
              and (.customMetrics | any(.value == 19.5))
            ))
            and (.customMetrics | any(.name == "Процент жира" and .unit == "%"))
            and .goal.title == "Подтянуться 10 раз"
            and (.goal.stages | any(.title == "Первые пять"))
          ' <<<"$progress" >/dev/null
          exercise_ref=$(jq -er '
            .workouts[]
            | select(.notes == "Синтетическая проверка переноса Yandex stage")
            | .exercises[] | select(.source == "custom") | .ref
          ' <<<"$training")
          stage_smoke_check=exercise-progress
          exercise_progress=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            --get --data-urlencode "limit=20" \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/clients/$client_id/progress/exercises/$exercise_ref")
          jq -e '
            .totalCount == 1 and .nextCursor == null
            and (.items | any(
              .confirmedSetCount == 1 and .bestWeightKg == 42.5
              and .isPrimaryPr == true
            ))
          ' <<<"$exercise_progress" >/dev/null
          stage_smoke_check=running-progress
          running_progress=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            --get --data-urlencode "from=2026-08-01" --data-urlencode "to=2026-08-31" \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/clients/$client_id/progress/running")
          jq -e '
            (.sessions | any(.distanceKm == 5.2 and .durationSec == 1740))
          ' <<<"$running_progress" >/dev/null
          stage_smoke_check=workout-chronicle
          chronicle=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header "X-Fit-Pilot-Session: $fixture_token" \
            "${api_url%/}/v1/clients/$client_id/workout-chronicle?limit=20")
          jq -e '
            .totalCount == 1 and .nextCursor == null
            and (.items | any(
              .workoutDate == "2026-08-22" and .confirmedSetCount == 2
              and .durationSec == 3600 and .hasPr == true
            ))
          ' <<<"$chronicle" >/dev/null
          stage_smoke_check=training-summaries
