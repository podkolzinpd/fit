name: Provision Yandex production platform

on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Create a reviewed production platform plan without applying it'
        required: true
        type: boolean
        default: true
      confirmation:
        description: 'For apply only: PROVISION_FIT_YANDEX_PRODUCTION'
        required: false
        type: string

concurrency:
  group: yandex-production-platform
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_CLI_CONFIG_FILE: ${{ github.workspace }}/infra/yandex/terraform.rc.example
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-provider-cache
  TF_VAR_cloud_id: ${{ vars.YC_CLOUD_ID }}
  TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
  TF_VAR_environment: prod
  TF_VAR_zone: ru-central1-d
  TF_VAR_subnet_cidr: 10.52.0.0/24
  TF_VAR_postgres_resource_preset_id: s3-c2-m8
  TF_VAR_postgres_disk_size_gb: '20'
  TF_VAR_postgres_backup_retain_period_days: '14'
  TF_VAR_postgres_backup_window_start: '{"hours":0,"minutes":30}'
  TF_VAR_postgres_deletion_protection: 'true'
  TF_VAR_migration_execution_timeout: 900s
  TF_VAR_allow_unauthenticated_api: 'false'
  TF_VAR_deployer_member: serviceAccount:${{ vars.YC_DEPLOY_SA_ID }}
  TF_VAR_api_invoker_member: serviceAccount:${{ vars.YC_DEPLOY_SA_ID }}
  TF_VAR_migration_invoker_member: serviceAccount:${{ vars.YC_DEPLOY_SA_ID }}
  # Push is not provisioned by this narrow platform bootstrap. The required
  # values keep untargeted resources inert until the functional cutover PR.
  TF_VAR_push_function_id: not-provisioned
  TF_VAR_push_transport_secret_id: not-provisioned
  TF_VAR_push_transport_secret_version_id: not-provisioned
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_OIDC_AUDIENCE: https://github.com/podkolzinpd

jobs:
  validate:
    name: Validate production Terraform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false
      - uses: actions/cache@v4
        with:
          path: .terraform-provider-cache
          key: terraform-yandex-${{ runner.os }}-${{ hashFiles('infra/yandex/.terraform.lock.hcl') }}
      - name: Prepare Terraform provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Validate without remote state
        working-directory: infra/yandex
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  plan_and_apply:
    name: Plan or provision the private production platform
    needs: validate
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_TFSTATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_TFSTATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject an unconfirmed apply before remote access
        if: inputs.plan_only != true
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = PROVISION_FIT_YANDEX_PRODUCTION
      - name: Resolve immutable API image tag
        run: |
          image_tag=$(git rev-parse 'HEAD:services/api')
          echo "TF_VAR_api_image_tag=$image_tag" >> "$GITHUB_ENV"
          echo "TF_VAR_migration_image_tag=$image_tag" >> "$GITHUB_ENV"
          echo "API_IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false
      - uses: actions/cache@v4
        with:
          path: .terraform-provider-cache
          key: terraform-yandex-${{ runner.os }}-${{ hashFiles('infra/yandex/.terraform.lock.hcl') }}
      - name: Prepare Terraform provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Install Yandex Cloud CLI
        run: |
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            --output /tmp/install-yc.sh
          bash /tmp/install-yc.sh -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Exchange GitHub OIDC for the bounded deploy identity
        run: scripts/yandex-github-oidc.sh
      - name: Initialize isolated production state
        working-directory: infra/yandex
        run: >-
          terraform init
          -backend-config=backend.hcl.example
          -backend-config=bucket=${{ vars.YC_TFSTATE_BUCKET }}
          -backend-config=key=fit/prod/terraform.tfstate
      - name: Plan the minimal private production platform
        working-directory: infra/yandex
        run: |
          platform_targets=(
            -target=yandex_mdb_postgresql_database.fit
            -target=yandex_mdb_postgresql_user.api
            -target=yandex_lockbox_secret_iam_member.api_connection_secret_reader
            -target=yandex_lockbox_secret_iam_member.migration_api_connection_secret_reader
            -target=yandex_lockbox_secret_iam_member.migration_connection_secret_reader
            -target=yandex_iam_service_account_iam_member.deployer_self_use
            -target=yandex_iam_service_account_iam_member.api_deployer
            -target=yandex_iam_service_account_iam_member.migration_deployer
            -target=yandex_container_repository_lifecycle_policy.api
            -target=yandex_container_registry_iam_binding.api_image_puller
            -target=yandex_storage_bucket.media
            -target=yandex_storage_bucket_iam_binding.media_api_editor
            -target=yandex_lockbox_secret.media_s3_credentials
            -target=yandex_iam_service_account_static_access_key.api_media
            -target=yandex_lockbox_secret_iam_member.api_media_credentials_reader
            -target=yandex_lockbox_secret_iam_member.migration_media_credentials_reader
          )
          printf '%s\n' "${platform_targets[@]}" > production-platform-targets.txt
          terraform plan -out=production-platform.tfplan "${platform_targets[@]}"
          terraform show -json production-platform.tfplan > production-platform.tfplan.json
          node ../../scripts/check-yandex-terraform-plan.mjs production-platform.tfplan.json
          jq -e '
            [.planned_values.root_module.resources[]?
              | select(.address == "yandex_mdb_postgresql_cluster_v2.fit")
              | .values.hosts | length] == [1]
          ' production-platform.tfplan.json >/dev/null
      - name: Stop after the reviewed plan
        if: inputs.plan_only == true
        working-directory: infra/yandex
        run: |
          echo 'Production plan is ready; no cloud resources were changed.'
          jq -r '
            [.resource_changes[]?
              | select(.change.actions != ["no-op"])]
            | "Planned resource changes: \(length)"
          ' production-platform.tfplan.json
      - name: Apply only the reviewed platform plan
        if: inputs.plan_only != true
        working-directory: infra/yandex
        run: terraform apply -auto-approve production-platform.tfplan
      - name: Build and push the immutable API image
        if: inputs.plan_only != true
        working-directory: infra/yandex
        run: |
          repository=$(terraform output -raw api_repository_name)
          image="cr.yandex/${repository}:${API_IMAGE_TAG}"
          printf '%s' "$YC_TOKEN" | podman login --username iam --password-stdin cr.yandex
          if skopeo inspect --creds "iam:$YC_TOKEN" "docker://$image" >/dev/null 2>&1; then
            echo 'Immutable API image already exists; reusing it.'
          else
            podman build --platform linux/amd64 \
              --file ../../services/api/Dockerfile \
              --tag "$image" ../../services/api
            podman push "$image"
          fi
      - name: Plan the private API and migration containers
        if: inputs.plan_only != true
        working-directory: infra/yandex
        run: |
          terraform plan -out=production-runtime.tfplan \
            -target=yandex_serverless_container.api \
            -target=yandex_serverless_container.migration \
            -target=yandex_serverless_container_iam_binding.api_invocation \
            -target=yandex_serverless_container_iam_binding.migration_invocation
          terraform show -json production-runtime.tfplan > production-runtime.tfplan.json
          node ../../scripts/check-yandex-terraform-plan.mjs production-runtime.tfplan.json
      - name: Create the reviewed private API and migration containers
        if: inputs.plan_only != true
        working-directory: infra/yandex
        run: terraform apply -auto-approve production-runtime.tfplan
      - name: Apply the Yandex schema through the private runner
        if: inputs.plan_only != true
        working-directory: infra/yandex
        run: |
          migration_url=$(terraform output -raw migration_container_url)
          status=$(curl --silent --show-error --max-time 300 \
            --output migration-response.json --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $YC_TOKEN" \
            "${migration_url%/}/migrate")
          test "$status" = 200
          jq -e '.status == "migrated" and (.migrations | type == "array")' \
            migration-response.json >/dev/null
          jq -r '"Applied production schema migrations: " + ((.migrations | length) | tostring)' \
            migration-response.json
      - name: Verify private production API health and readiness
        if: inputs.plan_only != true
        working-directory: infra/yandex
        run: |
          api_url=$(terraform output -raw api_container_url)
          health_status=$(curl --silent --show-error --max-time 30 \
            --output api-health.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $YC_TOKEN" "${api_url%/}/health")
          ready_status=$(curl --silent --show-error --max-time 30 \
            --output api-ready.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $YC_TOKEN" "${api_url%/}/ready")
          test "$health_status" = 200
          test "$ready_status" = 200
          jq -e --arg release_id "$API_IMAGE_TAG" \
            '.status == "ok" and .releaseId == $release_id' api-health.json >/dev/null
          jq -e '.status == "ready"' api-ready.json >/dev/null
      - name: Verify production backup and privacy settings
        if: inputs.plan_only != true
        working-directory: infra/yandex
        run: |
          cluster_id=$(terraform output -raw database_cluster_id)
          cluster=$(yc managed-postgresql cluster get \
            --id "$cluster_id" --folder-id "$YC_FOLDER_ID" --format json)
          jq -e '
            .environment == "PRODUCTION"
            and .deletion_protection == true
            and (.hosts | length) == 1
            and all(.hosts[]; .assign_public_ip == false)
            and (.config.backup_retain_period_days | tonumber) == 14
          ' <<<"$cluster" >/dev/null
          echo 'Production PostgreSQL is private, deletion-protected and keeps 14 days of backups/PITR.'
