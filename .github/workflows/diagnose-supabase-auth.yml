name: Diagnose Supabase auth

on:
  workflow_dispatch:
    inputs:
      start_utc:
        description: Start of the diagnostic window in ISO-8601 UTC
        required: true
        type: string
      end_utc:
        description: End of the diagnostic window in ISO-8601 UTC, at most 60 minutes later
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  YC_DEPLOY_SA_ID: ${{ vars.YC_SUMMARY_DEPLOY_SA_ID }}
  YC_FOLDER_ID: ${{ vars.YC_SUMMARY_FOLDER_ID }}
  YC_OIDC_AUDIENCE: https://github.com/podkolzinpd
  SUMMARY_FUNCTION_NAME: fit-summarize-client-training

jobs:
  auth-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query sanitized auth aggregates
        run: node scripts/query-supabase-auth-logs.mjs "$START_UTC" "$END_UTC"
        env:
          START_UTC: ${{ inputs.start_utc }}
          END_UTC: ${{ inputs.end_utc }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  summary-function-logs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yandex Cloud CLI
        run: |
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            --output /tmp/install-yc.sh
          bash /tmp/install-yc.sh -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Exchange GitHub OIDC token for Yandex Cloud IAM token
        run: scripts/yandex-github-oidc.sh
      - name: Query sanitized summary function diagnostics
        run: |
          set -euo pipefail
          yc serverless function logs "$SUMMARY_FUNCTION_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --since "$START_UTC" \
            --until "$END_UTC" \
            --limit 500 \
            | grep -E 'summary model request started|summary structured response retry|summary quality check rejected response|REPORT RequestID|ERROR RequestID|execution timeout' \
            || true
        env:
          START_UTC: ${{ inputs.start_utc }}
          END_UTC: ${{ inputs.end_utc }}
