name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject rewritten or destructive migrations
        run: node scripts/check-migrations.mjs "$MIGRATION_BASE"
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha }}

  app-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run infra:policy:test
      - run: npm run frontend:hosting:test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

      - name: Verify offline frontend package against the real build
        run: node scripts/frontend-release.mjs dist "$RELEASE_ID" frontend-release.json
        env:
          RELEASE_ID: ${{ github.sha }}

  frontend-infrastructure:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra/yandex-frontend
      - run: terraform -chdir=infra/yandex-frontend init -backend=false
      - run: terraform -chdir=infra/yandex-frontend validate
      - run: terraform -chdir=infra/yandex-frontend test

  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  # Keep the required `app` check stable while quality/build and coverage run
  # concurrently. A failure or cancellation in either lane still blocks merge.
  app:
    needs: [app-quality, app-tests, frontend-infrastructure]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify app checks
        env:
          QUALITY_RESULT: ${{ needs.app-quality.result }}
          TESTS_RESULT: ${{ needs.app-tests.result }}
          INFRA_RESULT: ${{ needs.frontend-infrastructure.result }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_RESULT" != "success" || "$TESTS_RESULT" != "success" || "$INFRA_RESULT" != "success" ]]; then
            echo "App checks failed: quality=$QUALITY_RESULT tests=$TESTS_RESULT infrastructure=$INFRA_RESULT"
            exit 1
          fi
          echo "All app checks passed"

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci --prefix services/api
      - run: npm --prefix services/api run check

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pin to the version used by package-lock.json. Resolving `latest`
          # hits GitHub's unauthenticated release API and can be rate-limited.
          version: 2.116.0
      # GHCR throttles shared hosted runners even with an authenticated token.
      # The official Docker Hub mirror uses the runner's preconfigured pull auth.
      - name: Use Docker Hub for Supabase images
        run: echo 'SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io' >> "$GITHUB_ENV"
      # Database tests do not exercise the local mail inbox. Skipping Mailpit
      # avoids its fixed 54324 port colliding with a hosted runner process.
      - run: supabase start --exclude mailpit,studio,imgproxy,edge-runtime,vector
      - run: supabase db reset --local
      - run: supabase test db --local
      - name: Check generated database types
        run: npm run db:types:check

  yandex-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fit_actor_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fit_actor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci --prefix services/api
      - name: Apply clean PostgreSQL 17 migration chain and run RLS tests
        run: npm --prefix services/api run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fit_actor_test
      - name: Verify no pending API migrations remain
        run: npm --prefix services/api run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fit_actor_test

  e2e-scope:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect browser-relevant changes
        id: scope
        run: node scripts/e2e-scope.mjs "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  e2e-visual:
    needs: e2e-scope
    if: needs.e2e-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - project: visual-client-390
            shard: 1/2
          - project: visual-client-390
            shard: 2/2
          - project: visual-client-430
            shard: 1/2
          - project: visual-client-430
            shard: 2/2
          - project: visual-trainer-1440
            shard: 1/1
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      # The version must match @playwright/test in package-lock.json. The
      # official image already contains Chromium, WebKit and their OS deps.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Use Docker Hub for Supabase images
        run: echo 'SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io' >> "$GITHUB_ENV"
      # E2E authenticates through the local API; it does not inspect emails.
      # Keep the CI container set minimal and avoid Mailpit's fixed port.
      - run: supabase start --exclude mailpit,studio,imgproxy,edge-runtime,vector
      - run: supabase db reset --local
      - run: node scripts/wait-for-local-auth.mjs
      - name: Pull pinned Playwright runtime
        run: docker pull "$PLAYWRIGHT_IMAGE"
      # Every viewport shard owns a runner and a clean local database. This
      # preserves deterministic baselines while shortening the longest visual
      # lane without allowing tests to mutate one shared fixture concurrently.
      - name: Run isolated visual baseline shard
        run: |
          docker run --rm --init --ipc=host --network host \
            --env CI=true \
            --env VITE_SUPABASE_URL \
            --env VITE_SUPABASE_PUBLISHABLE_KEY \
            --env PLAYWRIGHT_PROJECT="${{ matrix.project }}" \
            --env PLAYWRIGHT_SHARD \
            --volume "${{ github.workspace }}:/work" \
            --volume "/usr/share/fonts:/usr/share/fonts:ro" \
            --workdir /work \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc 'fc-cache -f >/dev/null && exec npx playwright test --project="$PLAYWRIGHT_PROJECT" --workers=1 --shard="$PLAYWRIGHT_SHARD"'
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-visual-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-chromium:
    needs: e2e-scope
    if: needs.e2e-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1/2, 2/2]
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Use Docker Hub for Supabase images
        run: echo 'SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io' >> "$GITHUB_ENV"
      - run: supabase start --exclude mailpit,studio,imgproxy,edge-runtime,vector
      - run: supabase db reset --local
      - run: node scripts/wait-for-local-auth.mjs
      - name: Pull pinned Playwright runtime
        run: docker pull "$PLAYWRIGHT_IMAGE"
      - name: Run Chromium behavior scenarios
        run: |
          docker run --rm --init --ipc=host --network host \
            --env CI=true \
            --env VITE_SUPABASE_URL \
            --env VITE_SUPABASE_PUBLISHABLE_KEY \
            --env PLAYWRIGHT_SHARD \
            --volume "${{ github.workspace }}:/work" \
            --workdir /work \
            "$PLAYWRIGHT_IMAGE" \
            npx playwright test --project=mobile-chromium --shard="$PLAYWRIGHT_SHARD"
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-chromium-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Each lane owns a local Supabase instance. The four lanes run concurrently,
  # while short-lived browser processes keep WebKit engine failures isolated.
  e2e-webkit:
    needs: e2e-scope
    if: needs.e2e-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane: 1
            shards: '1 7'
          - lane: 2
            shards: '2 5'
          - lane: 3
            shards: '3 6'
          - lane: 4
            shards: '4 8'
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Use Docker Hub for Supabase images
        run: echo 'SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io' >> "$GITHUB_ENV"
      - run: supabase start --exclude mailpit,studio,imgproxy,edge-runtime,vector
      - run: supabase db reset --local
      - run: node scripts/wait-for-local-auth.mjs
      - name: Pull pinned Playwright runtime
        run: docker pull "$PLAYWRIGHT_IMAGE"
      - name: Run iPhone behavior scenarios in isolated parallel lanes
        shell: bash
        run: |
          set -euo pipefail

          run_webkit_shard() {
            local shard="$1"
            docker run --rm --init --ipc=host --network host \
              --env CI=true \
              --env VITE_SUPABASE_URL \
              --env VITE_SUPABASE_PUBLISHABLE_KEY \
              --volume "${{ github.workspace }}:/work" \
              --workdir /work \
              "$PLAYWRIGHT_IMAGE" \
              npx playwright test \
                --project=iphone-13-webkit \
                --workers=1 \
                --shard="${shard}/8"
          }

          for shard in ${{ matrix.shards }}; do
            if ! run_webkit_shard "$shard"; then
              echo "::warning::WebKit shard ${shard}/8 crashed; retrying once in a fresh container"
              run_webkit_shard "$shard"
            fi
          done
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-webkit-${{ matrix.lane }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve one stable required check regardless of whether the heavy browser
  # jobs ran, passed, failed or were intentionally skipped by the scope gate.
  e2e:
    needs: [e2e-scope, e2e-visual, e2e-chromium, e2e-webkit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify E2E result
        env:
          SCOPE_RESULT: ${{ needs.e2e-scope.result }}
          E2E_REQUIRED: ${{ needs.e2e-scope.outputs.required }}
          VISUAL_RESULT: ${{ needs.e2e-visual.result }}
          CHROMIUM_RESULT: ${{ needs.e2e-chromium.result }}
          WEBKIT_RESULT: ${{ needs.e2e-webkit.result }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "E2E scope detection failed"
            exit 1
          fi
          if [[ "$E2E_REQUIRED" != "true" ]]; then
            echo "E2E skipped: changes do not affect the browser runtime"
            exit 0
          fi
          if [[ "$VISUAL_RESULT" != "success" || "$CHROMIUM_RESULT" != "success" || "$WEBKIT_RESULT" != "success" ]]; then
            echo "E2E failed: visual=$VISUAL_RESULT chromium=$CHROMIUM_RESULT webkit=$WEBKIT_RESULT"
            exit 1
          fi
          echo "All E2E lanes passed"
