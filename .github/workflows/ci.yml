name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # 06:00 Moscow: full iPhone and visual-regression acceptance remains covered
    # without making every PR wait for the most unstable browser engine.
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  migration-safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject rewritten or destructive migrations
        run: node scripts/check-migrations.mjs "$MIGRATION_BASE"
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha }}

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run infra:policy:test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pin to the version used by package-lock.json. Resolving `latest`
          # hits GitHub's unauthenticated release API and can be rate-limited.
          version: 2.109.1
      # Database tests do not exercise the local mail inbox. Skipping Mailpit
      # avoids its fixed 54324 port colliding with a hosted runner process.
      - run: supabase start --exclude mailpit
      - run: supabase db reset --local
      - run: supabase test db --local
      - name: Check generated database types
        run: npm run db:types:check

  yandex-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fit_actor_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fit_actor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci --prefix services/api
      - name: Apply clean PostgreSQL 17 migration chain and run RLS tests
        run: npm --prefix services/api run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fit_actor_test
      - name: Verify no pending API migrations remain
        run: npm --prefix services/api run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fit_actor_test

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      # The version must match @playwright/test in package-lock.json. The
      # official image already contains Chromium, WebKit and their OS deps.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      # E2E authenticates through the local API; it does not inspect emails.
      # Keep the CI container set minimal and avoid Mailpit's fixed port.
      - run: supabase start --exclude mailpit
      - run: supabase db reset --local
      - name: Pull pinned Playwright runtime
        run: docker pull "$PLAYWRIGHT_IMAGE"
      - name: Run required Chromium behavior scenarios
        run: |
          docker run --rm --init --ipc=host --network host \
            --env CI=true \
            --env VITE_SUPABASE_URL \
            --env VITE_SUPABASE_PUBLISHABLE_KEY \
            --volume "${{ github.workspace }}:/work" \
            --workdir /work \
            "$PLAYWRIGHT_IMAGE" \
            npx playwright test --project=mobile-chromium
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-webkit:
    # WebKit is valuable iOS coverage, but its runner intermittently crashes
    # before app code runs. Keep it visible on every PR without blocking a
    # server-only rollout; the full required acceptance is repeated nightly.
    if: github.event_name != 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start --exclude mailpit
      - run: supabase db reset --local
      - name: Pull pinned Playwright runtime
        run: docker pull "$PLAYWRIGHT_IMAGE"
      - name: Run iPhone behavior scenarios with one clean-job retry
        run: |
          for attempt in 1 2; do
            docker run --rm --init --ipc=host --network host \
              --env CI=true \
              --env VITE_SUPABASE_URL \
              --env VITE_SUPABASE_PUBLISHABLE_KEY \
              --volume "${{ github.workspace }}:/work" \
              --workdir /work \
              "$PLAYWRIGHT_IMAGE" \
              npx playwright test --project=iphone-13-webkit --workers=1 && exit 0
            test "$attempt" -eq 2 && exit 1
          done
      - name: Upload WebKit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-webkit-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start --exclude mailpit
      - run: supabase db reset --local
      - name: Pull pinned Playwright runtime
        run: docker pull "$PLAYWRIGHT_IMAGE"
      - name: Run full iPhone acceptance
        run: |
          docker run --rm --init --ipc=host --network host \
            --env CI=true \
            --env VITE_SUPABASE_URL \
            --env VITE_SUPABASE_PUBLISHABLE_KEY \
            --volume "${{ github.workspace }}:/work" \
            --workdir /work \
            "$PLAYWRIGHT_IMAGE" \
            npx playwright test --project=iphone-13-webkit --workers=1
      # Поведенческие сценарии меняют общие seed-данные. Возвращаем эталонное
      # состояние перед снимками, иначе параллельные тренировки меняют главную.
      - name: Reset visual baseline data
        run: supabase db reset --local
      - name: Wait for local Auth after reset
        run: >-
          curl --fail --silent --show-error
          --retry 30 --retry-all-errors --retry-delay 1
          http://127.0.0.1:54321/auth/v1/health
          > /dev/null
      - name: Run isolated visual baselines
        run: |
          docker run --rm --init --ipc=host --network host \
            --env CI=true \
            --env VITE_SUPABASE_URL \
            --env VITE_SUPABASE_PUBLISHABLE_KEY \
            --volume "${{ github.workspace }}:/work" \
            --volume "/usr/share/fonts:/usr/share/fonts:ro" \
            --workdir /work \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc 'fc-cache -f >/dev/null && exec npx playwright test --project=visual-client-390 --project=visual-client-430 --project=visual-trainer-1440 --workers=1'
      - name: Upload nightly Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
