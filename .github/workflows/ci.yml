name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pin to the version used by package-lock.json. Resolving `latest`
          # hits GitHub's unauthenticated release API and can be rate-limited.
          version: 2.109.1
      # Database tests do not exercise the local mail inbox. Skipping Mailpit
      # avoids its fixed 54324 port colliding with a hosted runner process.
      - run: supabase start --exclude mailpit
      - run: supabase db reset --local
      - run: supabase test db --local
      - name: Check generated database types
        run: npm run db:types:check

  e2e:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      # E2E authenticates through the local API; it does not inspect emails.
      # Keep the CI container set minimal and avoid Mailpit's fixed port.
      - run: supabase start --exclude mailpit
      - run: supabase db reset --local
      - run: npx playwright install --with-deps chromium webkit
      - name: Run Chromium behavior scenarios
        run: npx playwright test --project=mobile-chromium
      - name: Run iPhone behavior scenarios
        run: npx playwright test --project=iphone-13-webkit --workers=1
      # Поведенческие сценарии меняют общие seed-данные. Возвращаем эталонное
      # состояние перед снимками, иначе параллельные тренировки меняют главную.
      - name: Reset visual baseline data
        run: supabase db reset --local
      - name: Run isolated visual baselines
        run: npx playwright test --project=visual-client-390 --project=visual-client-430 --project=visual-trainer-1440 --workers=1
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
