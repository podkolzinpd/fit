name: Manage approved corporate admin access
on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect, grant or revoke the selected owner-approved login
        type: choice
        required: true
        default: inspect
        options: [inspect, grant, revoke]
      account:
        description: One of the six separately owner-approved administrators
        type: choice
        default: primary
        options: [primary, additional, third, fourth, fifth, sixth]
      scope:
        description: Administrator capability or the independent invitation/services/personal/duty/profile test pilots
        type: choice
        default: administrator
        options: [administrator, invitation-pilot, services-pilot, personal-pilot, duty-pilot, duty-office-zone, profile-pilot]
      time_zone:
        description: Explicit IANA office timezone; only duty-office-zone grant uses it
        type: string
        required: false
        default: ''
      office_name:
        description: Exact assigned office name; omit only for a unique active office
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: cloudru-stage-vm
  cancel-in-progress: false
jobs:
  access:
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only the selected privately approved login on the current release
        env:
          CLOUDRU_DATABASE_CONFIG_JSON: ${{ secrets.CLOUDRU_STAGE_DATABASE_CONFIG_JSON }}
          PRIMARY_ADMIN_LOGIN_SHA256: ${{ secrets.FIT_CORPORATE_ADMIN_LOGIN_SHA256 }}
          ADDITIONAL_ADMIN_LOGIN_SHA256: ${{ secrets.FIT_CORPORATE_ADMIN_ADDITIONAL_LOGIN_SHA256 }}
          THIRD_ADMIN_LOGIN_SHA256: ${{ secrets.FIT_CORPORATE_ADMIN_THIRD_LOGIN_SHA256 }}
          FOURTH_ADMIN_LOGIN_SHA256: ${{ secrets.FIT_CORPORATE_ADMIN_FOURTH_LOGIN_SHA256 }}
          FIFTH_ADMIN_LOGIN_SHA256: ${{ secrets.FIT_CORPORATE_ADMIN_FIFTH_LOGIN_SHA256 }}
          SIXTH_ADMIN_LOGIN_SHA256: ${{ secrets.FIT_CORPORATE_ADMIN_SIXTH_LOGIN_SHA256 }}
          ADMIN_ACCOUNT: ${{ inputs.account }}
          CORPORATE_ADMIN_SCOPE: ${{ inputs.scope }}
          CORPORATE_DUTY_TIME_ZONE: ${{ inputs.time_zone }}
          CORPORATE_DUTY_OFFICE_NAME: ${{ inputs.office_name }}
          PILOT_TRAINER_LOGIN_SHA256: ${{ secrets.FIT_CORPORATE_INVITATION_PILOT_LOGIN_SHA256 }}
          SERVICES_TRAINER_LOGIN_SHA256: ${{ secrets.FIT_CORPORATE_SERVICES_PILOT_LOGIN_SHA256 }}
          CORPORATE_ADMIN_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$GITHUB_REF" = refs/heads/main
          test "$(hostname)" = fit-stage-app
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          case "$ADMIN_ACCOUNT" in
            primary) CORPORATE_ADMIN_LOGIN_SHA256=$PRIMARY_ADMIN_LOGIN_SHA256; CORPORATE_ADMIN_ACCESS_SLOT=1 ;;
            additional) CORPORATE_ADMIN_LOGIN_SHA256=$ADDITIONAL_ADMIN_LOGIN_SHA256; CORPORATE_ADMIN_ACCESS_SLOT=2 ;;
            third) CORPORATE_ADMIN_LOGIN_SHA256=$THIRD_ADMIN_LOGIN_SHA256; CORPORATE_ADMIN_ACCESS_SLOT=3 ;;
            fourth) CORPORATE_ADMIN_LOGIN_SHA256=$FOURTH_ADMIN_LOGIN_SHA256; CORPORATE_ADMIN_ACCESS_SLOT=4 ;;
            fifth) CORPORATE_ADMIN_LOGIN_SHA256=$FIFTH_ADMIN_LOGIN_SHA256; CORPORATE_ADMIN_ACCESS_SLOT=5 ;;
            sixth) CORPORATE_ADMIN_LOGIN_SHA256=$SIXTH_ADMIN_LOGIN_SHA256; CORPORATE_ADMIN_ACCESS_SLOT=6 ;;
            *) exit 1 ;;
          esac
          case "$CORPORATE_ADMIN_SCOPE" in
            administrator) ;;
            invitation-pilot) CORPORATE_ADMIN_LOGIN_SHA256=$PILOT_TRAINER_LOGIN_SHA256 ;;
            services-pilot) CORPORATE_ADMIN_LOGIN_SHA256=$SERVICES_TRAINER_LOGIN_SHA256 ;;
            personal-pilot) CORPORATE_ADMIN_LOGIN_SHA256=$SERVICES_TRAINER_LOGIN_SHA256 ;;
            duty-pilot) CORPORATE_ADMIN_LOGIN_SHA256=$SERVICES_TRAINER_LOGIN_SHA256 ;;
            profile-pilot) CORPORATE_ADMIN_LOGIN_SHA256=$SERVICES_TRAINER_LOGIN_SHA256 ;;
            duty-office-zone) CORPORATE_ADMIN_LOGIN_SHA256=$SERVICES_TRAINER_LOGIN_SHA256 ;;
            *) exit 1 ;;
          esac
          [[ "$CORPORATE_ADMIN_LOGIN_SHA256" =~ ^[a-f0-9]{64}$ ]]
          case "$CORPORATE_ADMIN_ACTION" in inspect|grant|revoke) ;; *) exit 1 ;; esac
          [[ "$CORPORATE_DUTY_TIME_ZONE" =~ ^[A-Za-z0-9_+/-]{0,100}$ ]]
          test "${#CORPORATE_DUTY_OFFICE_NAME}" -le 160
          [[ ! "$CORPORATE_DUTY_OFFICE_NAME" =~ [[:cntrl:]] ]]
          release=$(cat /opt/fit/RUNNING_SHA)
          test "$release" = "$(git rev-parse HEAD)"
          jq -e '.MIGRATION_DATABASE_HOST == "10.70.10.67" and .MIGRATION_DATABASE_PORT == "5432" and
            .MIGRATION_DATABASE_NAME == "fit" and .MIGRATION_DATABASE_USER == "fit_owner" and
            .MIGRATION_DATABASE_URL == null and all(.[]; type == "string" and length > 0 and
            (test("[\u0000-\u001f\u007f]") | not))' <<<"$CLOUDRU_DATABASE_CONFIG_JSON" >/dev/null
          umask 077
          owner="/opt/fit/secrets/corporate-admin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.env"
          sudo test ! -e "$owner"
          sudo install -m 600 /dev/null "$owner"
          trap 'sudo rm -f -- "$owner"' EXIT
          jq -r 'to_entries[] | select(.key | startswith("MIGRATION_DATABASE_")) | "\(.key)=\(.value)"' \
            <<<"$CLOUDRU_DATABASE_CONFIG_JSON" | sudo tee "$owner" >/dev/null
          printf 'MIGRATION_DATABASE_SSL_MODE=require\nGITHUB_REF=refs/heads/main\nGITHUB_REPOSITORY=podkolzinpd/fit\n' | sudo tee -a "$owner" >/dev/null
          printf 'CORPORATE_ADMIN_ACTION=%s\nCORPORATE_ADMIN_LOGIN_SHA256=%s\nCORPORATE_ADMIN_ACCESS_SLOT=%s\nCORPORATE_ADMIN_SCOPE=%s\n' "$CORPORATE_ADMIN_ACTION" "$CORPORATE_ADMIN_LOGIN_SHA256" "$CORPORATE_ADMIN_ACCESS_SLOT" "$CORPORATE_ADMIN_SCOPE" | sudo tee -a "$owner" >/dev/null
          printf 'CORPORATE_DUTY_TIME_ZONE=%s\nCORPORATE_DUTY_OFFICE_NAME=%s\n' "$CORPORATE_DUTY_TIME_ZONE" "$CORPORATE_DUTY_OFFICE_NAME" | sudo tee -a "$owner" >/dev/null
          sudo podman run --rm --read-only --memory=128m --cpus=0.5 --timeout=25 --cap-drop=ALL \
            --security-opt=no-new-privileges --env-file "$owner" --user "$(id -u):$(id -g)" \
            -v "$PWD/scripts/manage-corporate-admin-access.mjs:/operation.mjs:ro" \
            "localhost/fit-api:$release" node /operation.mjs
