name: Inspect nutrition pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: yandex-stage
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_CLI_CONFIG_FILE: ${{ github.workspace }}/infra/yandex/terraform.rc.example
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_OIDC_AUDIENCE: https://github.com/podkolzinpd
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_TFSTATE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_TFSTATE_SECRET_ACCESS_KEY }}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require current main and owner-approved private cohort
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false
      - name: Exchange GitHub OIDC for short-lived IAM
        run: scripts/yandex-github-oidc.sh
      - name: Read existing private runner address
        working-directory: infra/yandex
        run: >-
          terraform init
          -backend-config=backend.hcl.example
          -backend-config=bucket=${{ vars.YC_TFSTATE_BUCKET }}
          -backend-config=key=fit/stage/terraform.tfstate
      - name: Inspect only the five approved identities without mutations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          FIT_NUTRITION_ACCOUNT_COHORT: ${{ secrets.FIT_NUTRITION_ACCOUNT_COHORT }}
        run: |
          set -euo pipefail
          umask 077
          export MIGRATION_URL="$(terraform -chdir=infra/yandex output -raw migration_container_url)"
          node scripts/inspect-nutrition-pilot.mjs
          echo 'Verified exactly three clients and two trainers; no data/access changes.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nutrition-pilot-ids
          path: nutrition-pilot-ids.json
          if-no-files-found: error
          retention-days: 1
