name: Configure Cloud.ru nutrition pilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Enable or disable the exact approved nutrition cohort
        type: choice
        options: [enable, disable]
        default: enable
      ci_run_id:
        description: Successful CI run for current main
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudru-stage-vm
  cancel-in-progress: false

jobs:
  configure:
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify green current main and running API
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$GITHUB_REF" = refs/heads/main
          test "$(hostname)" = fit-stage-app
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          github_api() {
            curl --fail --silent --show-error --max-time 15 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$1"
          }
          run=$(github_api "actions/runs/$RUN_ID")
          commit=$(jq -er --arg repo "$GITHUB_REPOSITORY" 'select(.path == ".github/workflows/ci.yml" and
            .head_repository.full_name == $repo and .head_branch == "main" and
            (.event == "push" or .event == "workflow_dispatch") and .conclusion == "success") | .head_sha' <<<"$run")
          test "$commit" = "$GITHUB_SHA"
          test "$commit" = "$(github_api commits/main | jq -er .sha)"
          test "$(cat /opt/fit/RUNNING_SHA)" = "$commit"
          test "$(sudo podman inspect fit-api-stage --format '{{.Config.Image}}')" = "localhost/fit-api:$commit"
          sudo "$(command -v node)" scripts/check-cloudru-api-env.mjs
      - name: Stage the exact approved cohort privately
        id: cohort
        if: inputs.mode == 'enable'
        env:
          FIT_NUTRITION_ACCOUNT_COHORT: ${{ secrets.FIT_NUTRITION_ACCOUNT_COHORT }}
          FIT_NUTRITION_BARCODE_LOGIN_HASH: ${{ secrets.FIT_NUTRITION_BARCODE_LOGIN_HASH }}
          FIT_NUTRITION_PEREK_API_KEY: ${{ secrets.FIT_NUTRITION_PEREK_API_KEY }}
        run: |
          set -euo pipefail
          sudo test ! -L /opt/fit/secrets
          test "$(sudo stat -c '%u:%a' /opt/fit/secrets)" = 0:700
          extra="/opt/fit/secrets/nutrition-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          sudo test ! -e "$extra"
          sudo install -m 600 /dev/null "$extra"
          node scripts/configure-cloudru-nutrition.mjs prepare | sudo tee "$extra" >/dev/null
          node --input-type=module -e 'console.log("audit_required=" + (JSON.parse(process.env.FIT_NUTRITION_ACCOUNT_COHORT).length === 7))' >> "$GITHUB_OUTPUT"
      - name: Verify existing bindings fit the approved cohort without changing user data
        # Prior-six rollback must still revoke the fifth admission without
        # deleting its existing binding or changing the cap5 database function.
        if: inputs.mode == 'enable' && steps.cohort.outputs.audit_required == 'true'
        env:
          CLOUDRU_DATABASE_CONFIG_JSON: ${{ secrets.CLOUDRU_STAGE_DATABASE_CONFIG_JSON }}
          FIT_NUTRITION_ACCOUNT_COHORT: ${{ secrets.FIT_NUTRITION_ACCOUNT_COHORT }}
          FIT_NUTRITION_BARCODE_LOGIN_HASH: ${{ secrets.FIT_NUTRITION_BARCODE_LOGIN_HASH }}
          FIT_NUTRITION_PEREK_API_KEY: ${{ secrets.FIT_NUTRITION_PEREK_API_KEY }}
        run: |
          set -euo pipefail
          owner="/opt/fit/secrets/nutrition-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.env"
          sudo test ! -e "$owner"
          sudo install -m 600 /dev/null "$owner"
          trap 'sudo rm -f -- "$owner"' EXIT
          jq -e '.MIGRATION_DATABASE_HOST == "10.70.10.67" and .MIGRATION_DATABASE_PORT == "5432" and
            .MIGRATION_DATABASE_NAME == "fit" and .MIGRATION_DATABASE_USER == "fit_owner" and
            .MIGRATION_DATABASE_URL == null and
            all(.[]; type == "string" and length > 0 and (test("[\u0000-\u001f\u007f]") | not))' \
            <<<"$CLOUDRU_DATABASE_CONFIG_JSON" >/dev/null
          jq -r 'to_entries[] | select(.key | startswith("MIGRATION_DATABASE_")) | "\(.key)=\(.value)"' \
            <<<"$CLOUDRU_DATABASE_CONFIG_JSON" | sudo tee "$owner" >/dev/null
          printf 'MIGRATION_DATABASE_SSL_MODE=require\n' | sudo tee -a "$owner" >/dev/null
          node scripts/configure-cloudru-nutrition.mjs audit-cohort | sudo tee -a "$owner" >/dev/null
          sudo podman run --rm --read-only --memory=128m --cpus=0.5 --timeout=20 --cap-drop=ALL \
            --security-opt=no-new-privileges --env-file "$owner" \
            "localhost/fit-api:$GITHUB_SHA" node dist/cloudru-nutrition-bindings.js
      - name: Verify nutrition schema, candidate and atomic runtime configuration with rollback
        run: |
          set -euo pipefail
          id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          extra="/opt/fit/secrets/nutrition-input-$id.json"
          next="/opt/fit/secrets/api-nutrition-next-$id.env"
          previous="/opt/fit/secrets/api-before-nutrition-$id.env"
          candidate="fit-nutrition-candidate-$id"
          switched=false
          cleanup() {
            sudo podman rm --force --ignore "$candidate" >/dev/null
            sudo rm -f -- "$extra" "$next"
          }
          rollback() {
            if test "$switched" = true; then
              sudo cp -- "$previous" /opt/fit/secrets/api.env
              sudo podman rm --force --ignore fit-api-stage >/dev/null
              sudo podman run --detach --name fit-api-stage --restart unless-stopped \
                --publish 127.0.0.1:18080:8080 --env-file /opt/fit/secrets/api.env \
                --env APP_ENV=stage --env FIT_RELEASE_ID="$GITHUB_SHA" --env PORT=8080 "localhost/fit-api:$GITHUB_SHA" >/dev/null
            fi
          }
          trap cleanup EXIT
          trap rollback ERR INT TERM
          sudo "$(command -v node)" scripts/configure-cloudru-nutrition.mjs "$MODE" "$id"
          if test "$MODE" = enable; then
            sudo podman run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
              --env-file "$next" "localhost/fit-api:$GITHUB_SHA" node dist/cloudru-nutrition-smoke.js
          fi
          sudo podman run --detach --name "$candidate" --publish 127.0.0.1:18082:8080 \
            --env-file "$next" --env APP_ENV=stage --env FIT_RELEASE_ID="$GITHUB_SHA" \
            --env PORT=8080 "localhost/fit-api:$GITHUB_SHA" >/dev/null
          for attempt in {1..20}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18082/ready >/dev/null; then break; fi
            test "$attempt" -lt 20
            sleep 1
          done
          test "$(curl --silent --show-error --max-time 3 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18082/v1/profile)" = 401
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          sudo test ! -e "$previous"
          sudo cp -- /opt/fit/secrets/api.env "$previous"
          switched=true
          sudo mv -T -- "$next" /opt/fit/secrets/api.env
          sudo podman rm --force fit-api-stage >/dev/null
          sudo podman run --detach --name fit-api-stage --restart unless-stopped \
            --publish 127.0.0.1:18080:8080 --env-file /opt/fit/secrets/api.env \
            --env APP_ENV=stage --env FIT_RELEASE_ID="$GITHUB_SHA" --env PORT=8080 "localhost/fit-api:$GITHUB_SHA" >/dev/null
          for attempt in {1..20}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/ready >/dev/null; then break; fi
            test "$attempt" -lt 20
            sleep 1
          done
          sudo "$(command -v node)" scripts/check-cloudru-api-env.mjs
          if test "$MODE" = enable; then
            sudo podman run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
              --env-file /opt/fit/secrets/api.env "localhost/fit-api:$GITHUB_SHA" node dist/cloudru-nutrition-smoke.js
          fi
          test "$(curl --silent --show-error --max-time 3 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/v1/profile)" = 401
          # Gate only the canonical app and native clients; do not repair or
          # require unrelated www routing/CORS during nutrition activation.
          for origin in https://fit-training.ru capacitor://localhost https://localhost; do
            test "$(curl --silent --show-error --max-time 3 --output /dev/null --write-out '%{http_code}' \
              --request OPTIONS --header "Origin: $origin" --header 'Access-Control-Request-Method: POST' \
              http://127.0.0.1:18080/v1/clients)" = 204
          done
          trap - ERR INT TERM
          printf 'Cloud.ru nutrition configured after candidate checks; mode=%s.\n' "$MODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove any unconsumed credential staging files
        if: always()
        run: |
          sudo podman rm --force --ignore "fit-nutrition-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null
          sudo rm -f -- "/opt/fit/secrets/nutrition-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" \
            "/opt/fit/secrets/api-nutrition-next-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.env" \
            "/opt/fit/secrets/nutrition-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.env"
