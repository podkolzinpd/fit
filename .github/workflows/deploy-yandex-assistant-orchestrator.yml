name: Deploy production Yandex assistant orchestrator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-yandex-assistant-orchestrator.yml'
      - 'scripts/yandex-github-oidc.sh'
      - 'services/api/package.json'
      - 'services/api/package-lock.json'
      - 'services/api/src/assistant-orchestrator/**'
      - 'services/api/src/yandex-assistant-orchestrator-function.ts'
      - 'scripts/verify-yandex-function-release.mjs'
      - 'scripts/yandex-lockbox-mounts.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-yandex-assistant-orchestrator
  cancel-in-progress: false

env:
  YC_DEPLOY_SA_ID: ${{ vars.YC_SUMMARY_DEPLOY_SA_ID }}
  YC_FOLDER_ID: ${{ vars.YC_SUMMARY_FOLDER_ID }}
  YC_OIDC_AUDIENCE: https://github.com/podkolzinpd
  FUNCTION_NAME: fit-assistant-orchestrator
  RUNTIME_SA_NAME: fit-assistant-orchestrator
  LOCKBOX_NAME: fit-summarize-client-training-supabase

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - name: Build function package
        run: |
          npm ci --prefix services/api
          npm --prefix services/api run typecheck
          npm --prefix services/api run test
          npm --prefix services/api run build
          mkdir -p .yandex-assistant-orchestrator-package
          cp services/api/package.json services/api/package-lock.json .yandex-assistant-orchestrator-package/
          cp -R services/api/dist .yandex-assistant-orchestrator-package/dist
      - name: Install Yandex Cloud CLI
        run: |
          curl --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/install.sh --output /tmp/install-yc.sh
          bash /tmp/install-yc.sh -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Exchange GitHub OIDC token
        run: scripts/yandex-github-oidc.sh
      - name: Publish bounded function version
        run: |
          set -euo pipefail
          lockbox_id=$(yc lockbox secret get --name "$LOCKBOX_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq -er '.id')
          lockbox_version_id=$(yc lockbox secret get --id "$lockbox_id" --format json | jq -er '.current_version.id')
          runtime_sa_id=$(yc iam service-account get --name "$RUNTIME_SA_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq -er '.id' 2>/dev/null || yc iam service-account create --name "$RUNTIME_SA_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq -er '.id')
          # IAM bindings and public invoker are one-time bootstrap, never a
          # side effect of an application release. See the bootstrap runbook.
          if ! yc serverless function get --name "$FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" >/dev/null 2>&1; then
            yc serverless function create "$FUNCTION_NAME" --description 'Production Fit bounded assistant orchestrator' --folder-id "$YC_FOLDER_ID"
          fi
          previous_version_id=$(yc serverless function version get-by-tag --function-name "$FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" --tag '$latest' --format json 2>/dev/null | jq -r '.id // empty' || true)
          version=$(yc serverless function version create --function-name "$FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" --runtime nodejs22 --entrypoint dist/yandex-assistant-orchestrator-function.handler --memory 1GB --execution-timeout 120s --service-account-id "$runtime_sa_id" --source-path .yandex-assistant-orchestrator-package --environment RELEASE_SHA="$GITHUB_SHA" --secret id="$lockbox_id",version-id="$lockbox_version_id",key=SUPABASE_URL,environment-variable=SUPABASE_URL --secret id="$lockbox_id",version-id="$lockbox_version_id",key=SUPABASE_PUBLISHABLE_KEY,environment-variable=SUPABASE_PUBLISHABLE_KEY --secret id="$lockbox_id",version-id="$lockbox_version_id",key=SUPABASE_SERVICE_ROLE_KEY,environment-variable=SUPABASE_SERVICE_ROLE_KEY --secret id="$lockbox_id",version-id="$lockbox_version_id",key=YANDEX_CLOUD_FOLDER_ID,environment-variable=YANDEX_CLOUD_FOLDER_ID --secret id="$lockbox_id",version-id="$lockbox_version_id",key=YANDEX_CLOUD_MODEL_ID,environment-variable=YANDEX_CLOUD_MODEL_ID --format json)
          echo "ASSISTANT_PREVIOUS_VERSION_ID=$previous_version_id" >> "$GITHUB_ENV"
          echo "ASSISTANT_CANDIDATE_VERSION_ID=$(jq -er '.id' <<<"$version")" >> "$GITHUB_ENV"
          echo "ASSISTANT_LOCKBOX_VERSION_ID=$lockbox_version_id" >> "$GITHUB_ENV"
      - name: Verify candidate and roll back on smoke failure
        run: |
          set -euo pipefail
          node scripts/verify-yandex-function-release.mjs --function-name "$FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" --expected-version-id "$ASSISTANT_CANDIDATE_VERSION_ID" --previous-version-id "$ASSISTANT_PREVIOUS_VERSION_ID" | tee -a "$GITHUB_STEP_SUMMARY"
