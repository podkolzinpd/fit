name: Review connection snapshots
on:
  push:
    branches: [codex/client-invite-trainer-entry]
    paths: [.github/workflows/review-connection-snapshots.yml]
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'podkolzinpd/fit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        project: [visual-client-390, visual-client-430]
    services:
      postgres:
        image: postgres:17@sha256:3cec7eb015ba8adb28139fa5c83b8489cdf0e666e53dfdf20f598ae0cc8739e3
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fit_actor_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix services/api --ignore-scripts
      - run: npm --prefix services/api run build
      - name: Capture actual images for human review, without committing them
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          docker run --rm --init --ipc=host --network host \
            --env CI=true --env FIT_E2E_POSTGRES_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres \
            --env PROJECT --volume "$GITHUB_WORKSPACE:/work" \
            --volume /usr/share/fonts:/usr/share/fonts:ro --workdir /work \
            mcr.microsoft.com/playwright:v1.61.1-noble \
            bash -lc 'fc-cache -f >/dev/null && npx playwright test e2e/ui-visual.spec.ts --project="$PROJECT" --grep="trainer Clients list keeps its mobile" --workers=1 --update-snapshots=all'
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-candidate-${{ matrix.project }}
          path: e2e/ui-visual.spec.ts-snapshots/trainer-clients*linux*.png
          retention-days: 3
