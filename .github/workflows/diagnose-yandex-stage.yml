name: Diagnose Yandex stage

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'FIT or Yandex platform Request ID'
        required: true
        type: string
      since_utc:
        description: 'Incident window start in RFC-3339 UTC'
        required: true
        type: string
      until_utc:
        description: 'Incident window end in RFC-3339 UTC'
        required: true
        type: string
      operation:
        description: 'Known caller operation without query, for example GET /health'
        required: false
        type: string
        default: unknown
      service_name:
        description: 'Stage container whose logs should be inspected'
        required: true
        type: choice
        default: fit-stage-api
        options:
          - fit-stage-api
          - fit-stage-migration

permissions:
  contents: read
  id-token: write

concurrency:
  group: diagnose-yandex-stage
  cancel-in-progress: false

env:
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_OIDC_AUDIENCE: https://github.com/podkolzinpd

jobs:
  diagnose:
    name: Read sanitized API logs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate diagnostic inputs
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SINCE_UTC: ${{ inputs.since_utc }}
          UNTIL_UTC: ${{ inputs.until_utc }}
          OPERATION: ${{ inputs.operation }}
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          node scripts/validate-yandex-incident-inputs.mjs
          case "$SERVICE_NAME" in
            fit-stage-api|fit-stage-migration) ;;
            *) exit 1 ;;
          esac
      - name: Install Yandex Cloud CLI
        run: |
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            --output /tmp/install-yc.sh
          bash /tmp/install-yc.sh -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Exchange OIDC token for the stage deployment identity
        run: scripts/yandex-github-oidc.sh
      - name: Read and sanitize the incident window
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SINCE_UTC: ${{ inputs.since_utc }}
          UNTIL_UTC: ${{ inputs.until_utc }}
          OPERATION: ${{ inputs.operation }}
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          set -euo pipefail
          temporary_directory=$(mktemp -d)
          trap 'rm -rf "$temporary_directory"' EXIT
          container=$(yc serverless container get \
            --name "$SERVICE_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --format json)
          container_id=$(jq -er '.id' <<<"$container")
          revisions=$(yc serverless container revision list \
            --container-id "$container_id" \
            --format json)
          active_revision=$(jq -ec '
            map(select((.status // "") == "ACTIVE"))
            | sort_by(.created_at // .createdAt // "")
            | last
          ' <<<"$revisions")
          revision_id=$(jq -er '.id' <<<"$active_revision")
          image_url=$(jq -er '.image.image_url // .image.imageUrl' <<<"$active_revision")
          release_id=${image_url##*:}
          if ! [[ "$release_id" =~ ^[0-9a-f]{40}$ ]]; then
            release_id=unknown
          fi
          jq -n \
            --arg service_name "$SERVICE_NAME" \
            --arg resource_type serverless_container \
            --arg revision_id "$revision_id" \
            --arg release_id "$release_id" \
            --arg operation "$OPERATION" \
            '{
              serviceName: $service_name,
              resourceType: $resource_type,
              activeRevisionAtDiagnosis: $revision_id,
              activeReleaseAtDiagnosis: $release_id,
              operation: $operation
            }' > "$temporary_directory/context.json"
          yc logging read default \
            --folder-id "$YC_FOLDER_ID" \
            --resource-ids "$container_id" \
            --since "$SINCE_UTC" \
            --until "$UNTIL_UTC" \
            --limit 1000 \
            --format json > "$temporary_directory/logs.json"
          node scripts/summarize-yandex-incident-logs.mjs \
            "$temporary_directory/logs.json" \
            "$REQUEST_ID" \
            "$temporary_directory/context.json"
