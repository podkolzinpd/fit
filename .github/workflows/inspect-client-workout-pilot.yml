name: Inspect approved client workout test profiles
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudru-stage-vm
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve only the approved test profiles in a read-only transaction
        env:
          CLOUDRU_DATABASE_CONFIG_JSON: ${{ secrets.CLOUDRU_STAGE_DATABASE_CONFIG_JSON }}
          FIT_NUTRITION_ACCOUNT_COHORT: ${{ secrets.FIT_NUTRITION_ACCOUNT_COHORT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$GITHUB_REF" = refs/heads/main
          test "$(hostname)" = fit-stage-app
          umask 077
          owner="/opt/fit/secrets/client-workout-inspect-$GITHUB_RUN_ID.env"
          sudo test ! -e "$owner"
          sudo install -m 600 /dev/null "$owner"
          trap 'sudo rm -f -- "$owner"' EXIT
          jq -e '.MIGRATION_DATABASE_HOST == "10.70.10.67" and .MIGRATION_DATABASE_PORT == "5432" and
            .MIGRATION_DATABASE_NAME == "fit" and .MIGRATION_DATABASE_USER == "fit_owner" and
            .MIGRATION_DATABASE_URL == null and all(.[]; type == "string" and length > 0 and
            (test("[\\u0000-\\u001f\\u007f]") | not))' <<<"$CLOUDRU_DATABASE_CONFIG_JSON" >/dev/null
          jq -r 'to_entries[] | select(.key | startswith("MIGRATION_DATABASE_")) | "\(.key)=\(.value)"' \
            <<<"$CLOUDRU_DATABASE_CONFIG_JSON" | sudo tee "$owner" >/dev/null
          printf 'MIGRATION_DATABASE_SSL_MODE=require\nGITHUB_REF=refs/heads/main\nGITHUB_REPOSITORY=podkolzinpd/fit\n' | sudo tee -a "$owner" >/dev/null
          node --input-type=module -e 'import {prepareNativeNutritionCohort} from "./scripts/prepare-nutrition-native-cohort.mjs"; process.stdout.write("CLIENT_WORKOUT_LOGIN_COHORT="+prepareNativeNutritionCohort(process.env.FIT_NUTRITION_ACCOUNT_COHORT)+"\n")' | sudo tee -a "$owner" >/dev/null
          release=$(cat /opt/fit/RUNNING_SHA)
          [[ "$release" =~ ^[a-f0-9]{40}$ ]]
          mkdir -m 700 result
          sudo podman run --rm --read-only --memory=128m --cpus=0.5 --timeout=25 --cap-drop=ALL \
            --security-opt=no-new-privileges --env-file "$owner" --user "$(id -u):$(id -g)" \
            -v "$PWD/scripts/resolve-client-workout-pilot.mjs:/inspection.mjs:ro" \
            -v "$PWD/result:/result:rw" "localhost/fit-api:$release" node /inspection.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: client-workout-pilot-ids
          path: result/client-workout-pilot-ids.json
          retention-days: 1
          if-no-files-found: error
