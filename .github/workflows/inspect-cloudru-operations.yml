name: Copy Fit to owner Yandex Cloud folder
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        default: inventory
        options: [inventory, connectivity, export, database, media, restore, runtime, verify, inspect-target, source-code, certificates]
permissions:
  contents: read
concurrency:
  group: cloudru-stage-vm
  cancel-in-progress: false
jobs:
  copy:
    if: github.ref == 'refs/heads/codex/fit-yc-copy-20261128'
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect source without reading private values into logs
        env:
          COPY_PHASE: ${{ inputs.phase }}
          COPY_SSH_PRIVATE_KEY: ${{ secrets.FIT_YC_COPY_SSH_KEY }}
          COPY_CONFIG_JSON: ${{ secrets.FIT_YC_COPY_CONFIG_JSON }}
          SOURCE_DATABASE_CONFIG_JSON: ${{ secrets.CLOUDRU_STAGE_DATABASE_CONFIG_JSON }}
          COPY_REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          case "$COPY_PHASE" in
            inventory|connectivity) bash scripts/fit-yc-copy-source.sh ;;
            *) bash scripts/fit-yc-copy-transfer.sh ;;
          esac
