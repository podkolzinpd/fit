name: Inspect Cloud.ru production operations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 3
    concurrency:
      group: cloudru-stage-vm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read only sanitized metadata for the two approved support codes
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$GITHUB_REF" = refs/heads/fix/request-codes-503-20261111
          test "$(hostname)" = fit-stage-app
          sudo timeout 30 journalctl CONTAINER_NAME=fit-api-stage --since="24 hours ago" --lines=200000 --output=json --no-pager 2>/dev/null |
            python3 scripts/incident-support-code-diagnostics.py
