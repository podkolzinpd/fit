name: Inspect Cloud.ru production operations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 3
    concurrency:
      group: cloudru-stage-vm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify only the reviewed successful completion without exporting identities
        env:
          CLOUDRU_DATABASE_CONFIG_JSON: ${{ secrets.CLOUDRU_STAGE_DATABASE_CONFIG_JSON }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$GITHUB_REF" = refs/heads/fix/request-codes-503-20261111
          test "$(hostname)" = fit-stage-app
          test "$(sudo stat -c '%u:%a' /opt/fit/secrets)" = 0:700
          id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          owner="/opt/fit/secrets/incident-inspect-$id.env"
          sudo test ! -e "$owner"
          sudo install -m 600 /dev/null "$owner"
          trap 'sudo rm -f -- "$owner"' EXIT
          jq -e '.MIGRATION_DATABASE_HOST == "10.70.10.67" and .MIGRATION_DATABASE_PORT == "5432" and .MIGRATION_DATABASE_NAME == "fit" and .MIGRATION_DATABASE_USER == "fit_owner" and all(.[]; type == "string" and length > 0 and (test("[\u0000-\u001f\u007f]") | not))' <<<"$CLOUDRU_DATABASE_CONFIG_JSON" >/dev/null
          jq -r 'to_entries[] | select(.key | startswith("MIGRATION_DATABASE_")) | "\(.key)=\(.value)"' <<<"$CLOUDRU_DATABASE_CONFIG_JSON" | sudo tee "$owner" >/dev/null
          printf 'MIGRATION_DATABASE_SSL_MODE=require\n' | sudo tee -a "$owner" >/dev/null
          revision=$(cat /opt/fit/RUNNING_SHA)
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          test "$(sudo podman inspect fit-api-stage --format '{{.Config.Image}}')" = "localhost/fit-api:$revision"
          sudo timeout 20 journalctl CONTAINER_NAME=fit-api-stage --since="2026-11-11 19:04:00 UTC" --until="2026-11-11 19:05:00 UTC" --lines=1000 --output=json --no-pager 2>/dev/null |
            python3 scripts/incident-finish-target.py |
            sudo podman run --rm -i --read-only --memory=128m --cpus=0.5 --timeout=20 --cap-drop=ALL --security-opt=no-new-privileges --env-file "$owner" -v "$PWD/scripts/incident-finish-readback.mjs:/inspection.mjs:ro" "localhost/fit-api:$revision" node /inspection.mjs
