name: Inspect Cloud.ru production operations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 3
    concurrency:
      group: cloudru-stage-vm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read only technical metadata for the reported finish failure
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$GITHUB_REF" = refs/heads/fix/request-codes-503-20261111
          test "$(hostname)" = fit-stage-app
          sudo timeout 20 journalctl CONTAINER_NAME=fit-api-stage --since="2026-11-11 18:55:00 UTC" --until="2026-11-11 19:05:00 UTC" --lines=20000 --output=json --no-pager 2>/dev/null |
            python3 scripts/incident-finish-diagnostics.py
          sudo podman inspect fit-api-stage --format '{{.Config.Image}} {{.State.StartedAt}}'
