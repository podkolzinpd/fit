name: Copy Fit to owner Yandex Cloud folder
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        default: inventory
        options: [inventory, connectivity]
permissions:
  contents: read
concurrency:
  group: cloudru-stage-vm
  cancel-in-progress: false
jobs:
  copy:
    if: github.ref == 'refs/heads/codex/fit-yc-copy-20261128'
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect source without reading private values into logs
        env:
          COPY_PHASE: ${{ inputs.phase }}
          COPY_SSH_PRIVATE_KEY: ${{ secrets.FIT_YC_COPY_SSH_KEY }}
        run: bash scripts/fit-yc-copy-source.sh
