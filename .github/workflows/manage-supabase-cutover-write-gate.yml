name: Manage Supabase cutover write gate

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Inspect, pause, or resume source product writes'
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - enable
          - disable
      confirmation:
        description: 'Exact bounded confirmation required for enable or disable'
        required: false
        type: string

concurrency:
  group: yandex-tenant-migration
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci --prefix services/api
      - name: Resolve the reviewed Supabase session pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: >-
          supabase link
          --project-ref "$SUPABASE_PROJECT_ID"
          --password "$SUPABASE_DB_PASSWORD"
      - name: Inspect or change the source write gate
        env:
          FIT_SOURCE_CUTOVER_WRITE_GATE_ACTION: ${{ inputs.action }}
          FIT_SOURCE_CUTOVER_WRITE_GATE_CONFIRMATION: ${{ inputs.confirmation }}
          FIT_TENANT_SOURCE_SSL_ROOT_CERT: certs/supabase-prod-ca-2021.crt
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -s supabase/.temp/pooler-url
          export FIT_TENANT_SOURCE_POOLER_URL="$(<supabase/.temp/pooler-url)"
          npm --prefix services/api run tenant:cutover-write-gate
