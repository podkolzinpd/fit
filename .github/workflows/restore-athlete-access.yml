name: Restore one proven athlete card access
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [plan, apply, verify]
        default: plan
      plan_run_id:
        description: Private plan run ID; no contacts, client IDs or SQL
        type: string
        default: ''
      backup_run_id:
        description: Trusted backup with successful encrypted database backup and disposable restore steps
        type: string
        default: ''
      confirmation:
        description: Apply only after explicit owner authorization; type RESTORE_PROVEN_ATHLETE_CARD_ACCESS
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudru-stage-vm
  cancel-in-progress: false
jobs:
  restore:
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Plan, restore or verify only the proven athlete card access
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_PHASE: ${{ inputs.phase }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDRU_DATABASE_CONFIG_JSON: ${{ secrets.CLOUDRU_STAGE_DATABASE_CONFIG_JSON }}
          FIT_ATHLETE_RESTORE_TARGETS: ${{ secrets.FIT_ATHLETE_RESTORE_TARGETS }}
          FIT_ACCOUNT_HISTORY_EVIDENCE: ${{ secrets.FIT_ACCOUNT_HISTORY_EVIDENCE }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$GITHUB_REF" = refs/heads/main
          test "$(hostname)" = fit-stage-app
          github_api() {
            curl --fail --silent --show-error --max-time 15 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$1"
          }
          test "$(github_api commits/main | jq -er .sha)" = "$GITHUB_SHA"
          [[ "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+-[0-9]+$ ]]
          case "$RESTORE_PHASE" in plan|apply|verify) ;; *) exit 1 ;; esac
          umask 077
          test "$(sudo stat -c '%u:%a' /opt/fit/secrets)" = 0:700
          sudo test ! -L /opt/fit/secrets
          root=/opt/fit/athlete-restores
          if ! sudo test -e "$root"; then sudo install -d -m 700 "$root"; fi
          sudo test ! -L "$root"
          test "$(sudo stat -c '%u:%a' "$root")" = 0:700
          if test "$RESTORE_PHASE" = plan; then
            PLAN_RUN_ID="$GITHUB_RUN_ID"
            [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]
            directory="$root/$PLAN_RUN_ID"
            sudo test ! -e "$directory"
            sudo install -d -m 700 "$directory"
          else
            [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]
            github_api "actions/runs/$PLAN_RUN_ID" |
              jq -e '.path == ".github/workflows/restore-athlete-access.yml" and .head_branch == "main" and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"' >/dev/null
            directory="$root/$PLAN_RUN_ID"
            sudo test ! -L "$directory"
            test "$(sudo stat -c '%u:%a' "$directory")" = 0:700
            sudo test ! -L "$directory/plan.json"
            test "$(sudo stat -c '%u:%a' "$directory/plan.json")" = 0:600
          fi
          verified=false
          if test "$RESTORE_PHASE" = apply; then
            # A write never bypasses the ordinary full current-main checks.
            github_api 'actions/workflows/ci.yml/runs?branch=main&status=success&per_page=30' |
              jq -e --arg commit "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $commit and .head_branch == "main" and .status == "completed" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | length > 0' >/dev/null
            test "$CONFIRMATION" = RESTORE_PROVEN_ATHLETE_CARD_ACCESS
            [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]]
            github_api "actions/runs/$BACKUP_RUN_ID" |
              jq -e '.path == ".github/workflows/backup-cloudru-production.yml" and .head_branch == "main" and .status == "completed" and ((now - (.updated_at | fromdateiso8601)) >= 0) and ((now - (.updated_at | fromdateiso8601)) <= 3600)' >/dev/null
            # Media health is separate: require the actual encrypted DB backup and restore,
            # never turn a failed backup/restore into a pass because another step succeeded.
            github_api "actions/runs/$BACKUP_RUN_ID/jobs?per_page=100" |
              jq -e '[.jobs[].steps[] | select(.name == "Back up only Cloud.ru PostgreSQL into encrypted private Cloud.ru S3" or .name == "Restore downloaded backup into a disposable PostgreSQL without network")] | length == 2 and all(.[]; .conclusion == "success" and ((now - (.completed_at | fromdateiso8601)) >= 0) and ((now - (.completed_at | fromdateiso8601)) <= 3600))' >/dev/null
            verified=true
          fi
          private_env="/opt/fit/secrets/athlete-restore-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.env"
          sudo test ! -e "$private_env"
          sudo test ! -L "$private_env"
          sudo install -m 600 /dev/null "$private_env"
          trap 'sudo rm -f -- "$private_env"' EXIT
          if test "$RESTORE_PHASE" = verify; then
            sudo awk '/^DATABASE_(HOST|PORT|NAME|USER|PASSWORD|SSL_MODE)=/' /opt/fit/secrets/api.env |
              sudo tee -a "$private_env" >/dev/null
          else
            jq -e '.MIGRATION_DATABASE_HOST == "10.70.10.67" and .MIGRATION_DATABASE_PORT == "5432" and .MIGRATION_DATABASE_NAME == "fit" and .MIGRATION_DATABASE_USER == "fit_owner" and .MIGRATION_DATABASE_URL == null and all(.[]; type == "string" and length > 0 and (test("[\u0000-\u001f\u007f]") | not))' <<<"$CLOUDRU_DATABASE_CONFIG_JSON" >/dev/null
            jq -r 'to_entries[] | select(.key | test("^MIGRATION_DATABASE_(HOST|PORT|NAME|USER|PASSWORD)$")) | "\(.key)=\(.value)"' <<<"$CLOUDRU_DATABASE_CONFIG_JSON" | sudo tee -a "$private_env" >/dev/null
            printf 'MIGRATION_DATABASE_SSL_MODE=require\n' | sudo tee -a "$private_env" >/dev/null
          fi
          if test "$RESTORE_PHASE" = plan; then
            for name in FIT_ATHLETE_RESTORE_TARGETS FIT_ACCOUNT_HISTORY_EVIDENCE; do
              value=${!name}
              test -n "$value"
              echo "::add-mask::$value"
              test "$value" = "${value//$'\n'/}"
              test "$value" = "${value//$'\r'/}"
              printf '%s=%s\n' "$name" "$value" | sudo tee -a "$private_env" >/dev/null
            done
          fi
          printf 'RESTORE_PHASE=%s\nRESTORE_BACKUP_VERIFIED=%s\nGITHUB_REF=refs/heads/main\nGITHUB_REPOSITORY=podkolzinpd/fit\nGITHUB_RUN_ID=%s\nGITHUB_RUN_ATTEMPT=%s\nGITHUB_ACTOR=%s\n' "$RESTORE_PHASE" "$verified" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_ACTOR" | sudo tee -a "$private_env" >/dev/null
          revision=$(cat /opt/fit/RUNNING_SHA)
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          sudo podman run --rm --read-only --user 0 --memory=512m --cpus=0.5 --timeout=180 --cap-drop=ALL --security-opt=no-new-privileges --env-file "$private_env" \
            -v "$PWD/scripts/cloudru-athlete-access-restore.mjs:/restore.mjs:ro" \
            -v "$PWD/scripts/cloudru-account-history-audit.mjs:/cloudru-account-history-audit.mjs:ro" \
            -v "$directory:/repair" "localhost/fit-api:$revision" node /restore.mjs | tee -a "$GITHUB_STEP_SUMMARY"
