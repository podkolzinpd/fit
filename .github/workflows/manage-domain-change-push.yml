name: Manage domain-change push announcement

run-name: ${{ inputs.announcement_action }} canonical-domain push announcement

on:
  workflow_dispatch:
    inputs:
      announcement_action:
        description: Inspect recipients or enqueue the reviewed announcement
        required: true
        type: choice
        options:
          - inspect
          - enqueue
      confirmation:
        description: Enter QUEUE_DOMAIN_CHANGE_ANNOUNCEMENT to enqueue
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: yandex-stage
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_CLI_CONFIG_FILE: ${{ github.workspace }}/infra/yandex/terraform.rc.example
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-provider-cache
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_OIDC_AUDIENCE: https://github.com/podkolzinpd
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_TFSTATE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_TFSTATE_SECRET_ACCESS_KEY }}

jobs:
  announcement:
    name: Inspect or queue the one-time announcement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate the bounded operation
        env:
          ACTION: ${{ inputs.announcement_action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          case "$ACTION" in
            inspect) test -z "$CONFIRMATION" ;;
            enqueue) test "$CONFIRMATION" = QUEUE_DOMAIN_CHANGE_ANNOUNCEMENT ;;
            *) exit 1 ;;
          esac
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false
      - uses: actions/cache@v4
        with:
          path: .terraform-provider-cache
          key: terraform-yandex-${{ runner.os }}-${{ hashFiles('infra/yandex/.terraform.lock.hcl') }}
      - name: Prepare Terraform provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Exchange GitHub OIDC token for a short-lived IAM token
        run: scripts/yandex-github-oidc.sh
      - name: Read the private runner URL from remote state
        working-directory: infra/yandex
        run: >-
          terraform init
          -backend-config=backend.hcl.example
          -backend-config=bucket=${{ vars.YC_TFSTATE_BUCKET }}
          -backend-config=key=fit/stage/terraform.tfstate
      - name: Inspect or queue the announcement
        working-directory: infra/yandex
        env:
          ACTION: ${{ inputs.announcement_action }}
        run: |
          set -euo pipefail
          umask 077
          migration_url=$(terraform output -raw migration_container_url)
          jq -n --arg action "$ACTION" '{action: $action}' > announcement-request.json
          status=$(curl --silent --show-error \
            --output announcement-response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $YC_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @announcement-request.json \
            "${migration_url%/}/stage/push/domain-change-announcement")
          if test "$status" != 200; then
            echo "Domain-change announcement runner returned HTTP $status." >&2
            exit 1
          fi
          if test "$ACTION" = inspect; then
            expected_status=domain_change_announcement_inspected
          else
            expected_status=domain_change_announcement_queued
          fi
          jq -e --arg expected "$expected_status" '
            .status == $expected
            and (.eligibleUsers | type == "number" and . >= 0)
            and (.eligibleSubscriptions | type == "number" and . >= 0)
            and (.alreadyQueued | type == "number" and . >= 0)
            and (.inserted | type == "number" and . >= 0)
            and .eligibleUsers <= .eligibleSubscriptions
            and .alreadyQueued <= .eligibleSubscriptions
            and .inserted <= .eligibleSubscriptions
          ' announcement-response.json >/dev/null
          if test "$ACTION" = inspect; then
            jq -e '.inserted == 0' announcement-response.json >/dev/null
          fi
          {
            echo '### Canonical-domain push announcement'
            echo "- Operation: \`$ACTION\`"
            echo "- Eligible users: \`$(jq -r '.eligibleUsers' announcement-response.json)\`"
            echo "- Eligible subscriptions: \`$(jq -r '.eligibleSubscriptions' announcement-response.json)\`"
            echo "- Already queued: \`$(jq -r '.alreadyQueued' announcement-response.json)\`"
            echo "- Newly queued: \`$(jq -r '.inserted' announcement-response.json)\`"
            echo '- Title: `Fit теперь на новом адресе`'
            echo '- Body: `Открывайте приложение на fit-training.ru. Старая ссылка пока перенаправляет автоматически.`'
            echo '- Click target: `/` (legacy origins redirect to `fit-training.ru`)'
          } >> "$GITHUB_STEP_SUMMARY"
