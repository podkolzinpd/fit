name: Inspect or restore SpeechKit relay

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect only or restore the exact production relay VM
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply
      confirmation:
        description: Type RESTORE_SPEECHKIT_RELAY for apply mode
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-speechkit-relay
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    env:
      YC_DEPLOY_SA_ID: ${{ vars.YC_SUMMARY_DEPLOY_SA_ID }}
      YC_FOLDER_ID: ${{ vars.YC_SUMMARY_FOLDER_ID }}
      YC_OIDC_AUDIENCE: https://github.com/podkolzinpd
      RELAY_VM_NAME: fit-speechkit-relay-vm
      RELAY_EXPECTED_IP: 84.201.157.124
      RELAY_HOST: 84-201-157-124.sslip.io
    steps:
      - uses: actions/checkout@v4
      - name: Install Yandex Cloud CLI
        run: |
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            --output /tmp/install-yc.sh
          bash /tmp/install-yc.sh -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Exchange GitHub OIDC token
        run: scripts/yandex-github-oidc.sh
      - name: Configure ephemeral Yandex Cloud CLI profile
        run: |
          yc config profile create github-actions
          yc config set token "$YC_IAM_TOKEN"
          yc config set folder-id "$YC_FOLDER_ID"
      - name: Inspect exact relay VM and address
        run: |
          set -euo pipefail
          instances=$(yc compute instance list --folder-id "$YC_FOLDER_ID" --format json)
          instance=$(jq -cer --arg relay_name "$RELAY_VM_NAME" \
            '.[] | select(.name == $relay_name)' <<<"$instances")
          relay_id=$(jq -er '.id' <<<"$instance")
          relay_status=$(jq -er '.status' <<<"$instance")
          relay_ip=$(jq -er '.network_interfaces[0].primary_v4_address.one_to_one_nat.address' <<<"$instance")
          relay_zone=$(jq -er '.zone_id' <<<"$instance")

          [[ "$relay_status" == "RUNNING" ]]
          [[ "$relay_ip" == "$RELAY_EXPECTED_IP" ]]

          addresses=$(yc vpc address list --folder-id "$YC_FOLDER_ID" --format json)
          address=$(jq -cer --arg relay_ip "$relay_ip" \
            '.[] | select(.external_ipv4_address.address == $relay_ip)' <<<"$addresses")
          address_id=$(jq -er '.id' <<<"$address")
          address_reserved=$(jq -r '.reserved // false' <<<"$address")

          curl --fail --silent --show-error \
            --connect-timeout 5 \
            --max-time 10 \
            "http://$relay_ip:8080/" >/dev/null

          printf 'Relay VM: %s (%s)\n' "$relay_id" "$relay_status"
          printf 'Zone: %s\n' "$relay_zone"
          printf 'Public IP: %s\n' "$relay_ip"
          printf 'Address: %s (reserved=%s)\n' "$address_id" "$address_reserved"
          printf 'Metadata keys: %s\n' "$(jq -cr '(.metadata // {}) | keys' <<<"$instance")"
          printf 'RELAY_VM_ID=%s\n' "$relay_id" >>"$GITHUB_ENV"
          printf 'RELAY_ADDRESS_ID=%s\n' "$address_id" >>"$GITHUB_ENV"
          printf 'RELAY_ADDRESS_RESERVED=%s\n' "$address_reserved" >>"$GITHUB_ENV"

      - name: Require explicit production confirmation
        if: inputs.mode == 'apply'
        env:
          RESTORE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$RESTORE_CONFIRMATION" == "RESTORE_SPEECHKIT_RELAY" ]] || {
            echo 'Apply mode requires the exact confirmation RESTORE_SPEECHKIT_RELAY.' >&2
            exit 1
          }

      - name: Reserve current IP and restore HTTPS/WSS proxy
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          if [[ "$RELAY_ADDRESS_RESERVED" != "true" ]]; then
            if ! reserve_output=$(yc vpc address update --reserved=true "$RELAY_ADDRESS_ID" 2>&1); then
              if [[ "$reserve_output" == *"vpc.externalStaticAddresses.count exceeded"* ]]; then
                echo '::warning::Static IP quota is full; continuing without stopping the VM. A normal restart retains its dynamic IP.'
              else
                printf '%s\n' "$reserve_output" >&2
                exit 1
              fi
            fi
          fi

          full_instance=$(yc compute instance get --id "$RELAY_VM_ID" --full --format json)
          jq -r '.metadata["ssh-keys"] // empty' <<<"$full_instance" >/tmp/speechkit-original-ssh-keys
          ssh-keygen -q -t ed25519 -N '' -C speechkit-recovery -f /tmp/speechkit-recovery-key
          cp /tmp/speechkit-original-ssh-keys /tmp/speechkit-active-ssh-keys
          if [[ -s /tmp/speechkit-active-ssh-keys ]]; then
            printf '\n' >>/tmp/speechkit-active-ssh-keys
          fi
          printf 'yc-user:%s\n' "$(cat /tmp/speechkit-recovery-key.pub)" >>/tmp/speechkit-active-ssh-keys

          cleanup_ssh_key() {
            set +e
            if [[ -s /tmp/speechkit-original-ssh-keys ]]; then
              yc compute instance add-metadata \
                --id "$RELAY_VM_ID" \
                --metadata-from-file ssh-keys=/tmp/speechkit-original-ssh-keys >/dev/null
            else
              yc compute instance remove-metadata --id "$RELAY_VM_ID" --keys ssh-keys >/dev/null
            fi
            rm -f /tmp/speechkit-recovery-key /tmp/speechkit-recovery-key.pub \
              /tmp/speechkit-active-ssh-keys /tmp/speechkit-original-ssh-keys \
              /tmp/speechkit-known-hosts
          }
          trap cleanup_ssh_key EXIT

          yc compute instance add-metadata \
            --id "$RELAY_VM_ID" \
            --metadata-from-file ssh-keys=/tmp/speechkit-active-ssh-keys >/dev/null

          ssh_options=(
            -i /tmp/speechkit-recovery-key
            -o BatchMode=yes
            -o ConnectTimeout=5
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=/tmp/speechkit-known-hosts
          )
          find_ssh_user() {
            local candidate
            for candidate in yc-user ubuntu; do
              if ssh "${ssh_options[@]}" "$candidate@$RELAY_EXPECTED_IP" true 2>/dev/null; then
                printf '%s' "$candidate"
                return 0
              fi
            done
            return 1
          }

          ssh_user=''
          for attempt in $(seq 1 5); do
            if ssh_user=$(find_ssh_user); then break; fi
            sleep 3
          done
          if [[ -z "$ssh_user" ]]; then
            yc compute instance restart --id "$RELAY_VM_ID"
            for attempt in $(seq 1 40); do
              if ssh_user=$(find_ssh_user); then break; fi
              sleep 3
            done
          fi
          [[ -n "$ssh_user" ]]
          ssh "${ssh_options[@]}" "$ssh_user@$RELAY_EXPECTED_IP" \
            'sudo bash -s' <services/speechkit-relay/recover-startup.sh

      - name: Verify HTTPS and SpeechKit WebSocket
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          healthy=false
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              "https://$RELAY_HOST/" >/dev/null; then
              healthy=true
              break
            fi
            sleep 5
          done
          [[ "$healthy" == "true" ]]
          npm ci --prefix services/speechkit-relay
          node services/speechkit-relay/smoke.mjs "wss://$RELAY_HOST/stt"
