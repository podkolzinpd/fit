name: Audit workout calories

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: yandex-stage
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_CLI_CONFIG_FILE: ${{ github.workspace }}/infra/yandex/terraform.rc.example
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-provider-cache
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YC_OIDC_AUDIENCE: https://github.com/podkolzinpd
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_TFSTATE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_TFSTATE_SECRET_ACCESS_KEY }}

jobs:
  audit:
    name: Read anonymized v1-v2 comparison
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require deployed main
        run: test "$GITHUB_REF" = 'refs/heads/main'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false
      - uses: actions/cache@v4
        with:
          path: .terraform-provider-cache
          key: terraform-yandex-${{ runner.os }}-${{ hashFiles('infra/yandex/.terraform.lock.hcl') }}
      - name: Prepare provider cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Exchange OIDC token
        run: scripts/yandex-github-oidc.sh
      - name: Read private runner URL
        working-directory: infra/yandex
        run: >-
          terraform init
          -backend-config=backend.hcl.example
          -backend-config=bucket=${{ vars.YC_TFSTATE_BUCKET }}
          -backend-config=key=fit/stage/terraform.tfstate
      - name: Print only aggregate calorie comparison
        working-directory: infra/yandex
        run: |
          set -euo pipefail
          migration_url=$(terraform output -raw migration_container_url)
          status=$(curl --silent --show-error --output calorie-audit-response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $YC_TOKEN" \
            "${migration_url%/}/stage/calories/audit")
          if test "$status" != 200; then
            echo "Calorie audit returned HTTP $status." >&2
            exit 1
          fi
          jq -e '.status == "ok" and .windowDays == 30 and (.categories | type == "array")' calorie-audit-response.json >/dev/null
          jq -c '{windowDays, categories: [.categories[] | {
            category, total, estimated, missingDuration, missingWeight,
            highKcal, moreThanDoubleV1, medianV2ToV1
          }]}' calorie-audit-response.json
