name: Manage client Lime rollout
run-name: ${{ inputs.mode }} client Lime (explicit owner operation)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect by default; owner-approved client presentation mode
        type: choice
        default: inspect
        options: [inspect, all, pilot, off]
      expected_revision:
        description: Revision from the preceding inspect; empty for inspect
        required: false
        type: string
      confirmation:
        description: Exact SET_CLIENT_LIME_ALL / PILOT / OFF; empty for inspect
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cloudru-stage-vm
  cancel-in-progress: false
jobs:
  rollout:
    runs-on: [self-hosted, cloudru-stage]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect or apply the explicitly approved client mode once
        env:
          CLOUDRU_DATABASE_CONFIG_JSON: ${{ secrets.CLOUDRU_STAGE_DATABASE_CONFIG_JSON }}
          LIME_TARGET: client
          LIME_MODE: ${{ inputs.mode }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = podkolzinpd/fit
          test "$GITHUB_REF" = refs/heads/main
          test "$(hostname)" = fit-stage-app
          umask 077
          node scripts/lime-rollout-request.mjs request >/dev/null
          sudo test ! -L /opt/fit/secrets
          test "$(sudo stat -c '%u:%a' /opt/fit/secrets)" = 0:700
          owner="/opt/fit/secrets/client-lime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.env"
          sudo test ! -e "$owner"
          sudo test ! -L "$owner"
          sudo install -m 600 /dev/null "$owner"
          trap 'sudo rm -f -- "$owner"' EXIT
          jq -e '.MIGRATION_DATABASE_HOST == "10.70.10.67" and .MIGRATION_DATABASE_PORT == "5432" and .MIGRATION_DATABASE_NAME == "fit" and .MIGRATION_DATABASE_USER == "fit_owner" and .MIGRATION_DATABASE_URL == null and all(.[]; type == "string" and length > 0 and (test("[\u0000-\u001f\u007f]") | not))' <<<"$CLOUDRU_DATABASE_CONFIG_JSON" >/dev/null
          jq -r 'to_entries[] | select(.key | test("^MIGRATION_DATABASE_(HOST|PORT|NAME|USER|PASSWORD)$")) | "\(.key)=\(.value)"' <<<"$CLOUDRU_DATABASE_CONFIG_JSON" | sudo tee "$owner" >/dev/null
          printf 'MIGRATION_DATABASE_SSL_MODE=require\nGITHUB_REF=refs/heads/main\nGITHUB_REPOSITORY=podkolzinpd/fit\nLIME_TARGET=client\nLIME_MODE=%s\nEXPECTED_REVISION=%s\nCONFIRMATION=%s\n' "$LIME_MODE" "$EXPECTED_REVISION" "$CONFIRMATION" | sudo tee -a "$owner" >/dev/null
          revision=$(cat /opt/fit/RUNNING_SHA)
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          test "$(sudo podman inspect fit-api-stage --format '{{.Config.Image}}')" = "localhost/fit-api:$revision"
          sudo podman run --rm --read-only --memory=128m --cpus=0.5 --timeout=60 --cap-drop=ALL --security-opt=no-new-privileges --env-file "$owner" -v "$PWD/scripts/cloudru-client-lime-rollout.mjs:/operation.mjs:ro" -v "$PWD/scripts/lime-rollout-request.mjs:/lime-rollout-request.mjs:ro" "localhost/fit-api:$revision" node /operation.mjs | tee -a "$GITHUB_STEP_SUMMARY"
